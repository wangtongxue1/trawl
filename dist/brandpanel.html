<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标签分组</title>
<style>
:root {
  --accent: #10b981; --accent-deep: #0b8f66;
  --panel: #ffffff; --bg: #f6f7f9; --hover: rgba(17,24,39,.055);
  --divider: rgba(17,24,39,.08); --border: rgba(17,24,39,.10);
  --text: #1f2329; --text-dim: #6b7785; --danger: #ef4444;
  --shadow-sm: 0 1px 3px rgba(16,24,40,.10);
  --shadow-md: 0 6px 20px rgba(16,24,40,.12);
}
/* 深色主题：浮层跟随 chrome 主题（由脚本读取 get_settings 设置 data-theme） */
:root[data-theme="dark"] {
  --panel: #262a31; --bg: #1d2025; --hover: rgba(255,255,255,.08);
  --divider: rgba(255,255,255,.09); --border: rgba(255,255,255,.12);
  --text: #e6e8eb; --text-dim: #98a2b3; --danger: #f87171;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.5);
  --shadow-md: 0 6px 20px rgba(0,0,0,.45);
}
/* 强调色四套（与 style.css 保持一致；浮层独立 webview 需自带规则） */
:root[data-accent="purple"] { --accent: #8b5cf6; --accent-deep: #6d4ff5; }
:root[data-accent="blue"]   { --accent: #3b82f6; --accent-deep: #2f6fe0; }
:root[data-accent="orange"] { --accent: #f59e0b; --accent-deep: #d97706; }
:root[data-accent="green"]  { --accent: #10b981; --accent-deep: #0b8f66; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; padding: 12px; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text); user-select: none; overflow: hidden;
  font-size: 12px;
}
svg { display: none; }
.ic {
  width: 16px; height: 16px; display: block; flex-shrink: 0;
  stroke: currentColor; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* 命名 + 配色 */
.identity { padding: 12px 14px 8px; }
.name-input {
  width: 100%; height: 38px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--panel); color: var(--text);
  padding: 0 12px; font-size: 13px; font-family: inherit; outline: none;
  user-select: text;
}
.name-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.colors { display: flex; align-items: center; gap: 8px; margin: 8px 2px 2px; }
.dot {
  width: 19px; height: 19px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  background: var(--c); position: relative; flex-shrink: 0;
  padding: 0; transition: transform .12s ease;
}
/* 「无配色」用虚线圈表示，和斜线禁用符号区分开 */
.dot.none { background: var(--panel); border: 2px dashed #c2ccd6; }
.dot:hover { transform: scale(1.12); }
.dot.active { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text-dim); }

/* 功能列表 */
.actions { padding: 6px 8px 8px; }
.act {
  width: 100%; height: 31px;
  display: flex; align-items: center; gap: 8px;
  border: none; border-radius: 8px; background: transparent;
  color: var(--text); font-size: 12px; font-family: inherit;
  cursor: pointer; text-align: left; padding: 0 9px;
}
.act:hover { background: var(--hover); }
.act .ic { color: var(--text-dim); }
.act:hover .ic { color: var(--accent-deep); }
.act .t { flex-shrink: 0; }
.act .desc { color: var(--text-dim); font-size: 11px; margin-left: auto; }
.act kbd {
  margin-left: auto; color: var(--text-dim);
  font-family: inherit; font-size: 11px; letter-spacing: .2px;
}
.act.danger:hover { color: var(--danger); }
.act.danger:hover .ic { color: var(--danger); }
.sep { height: 1px; background: var(--divider); margin: 5px 14px; }

/* 工作区列表 */
.ws-title { font-size: 11px; color: var(--text-dim); padding: 8px 16px 4px; letter-spacing: .3px; }
.workspaces { padding: 0 8px 6px; max-height: 120px; overflow-y: auto; }
.ws {
  display: flex; align-items: center; gap: 9px;
  height: 32px; padding: 0 9px; border-radius: 8px; cursor: pointer;
}
.ws:hover { background: var(--hover); }
.ws .bullet { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.ws .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws .chk { color: var(--accent-deep); font-size: 13px; opacity: 0; }
.ws.on .chk { opacity: 1; }
.add-ws {
  width: calc(100% - 16px); margin: 0 8px 10px; height: 32px;
  border: 1px dashed var(--border); border-radius: 8px;
  background: transparent; color: var(--text-dim);
  font-family: inherit; font-size: 12px; cursor: pointer;
}
.add-ws:hover { border-color: var(--accent); color: var(--accent-deep); }
.foot {
  background: var(--bg); color: var(--text-dim);
  font-size: 11px; text-align: center; padding: 7px 12px;
  border-top: 1px solid var(--divider);
}

/* 自绘确认框：原生 confirm 会阻塞 WebView2，浮层直接假死（还会顶着
   「tauri.localhost 显示」这种系统标题），所以这里一律用面板内对话框 */
.mask {
  position: fixed; inset: 12px;
  border-radius: 16px;
  background: rgba(16, 24, 40, .32);
  backdrop-filter: blur(1.5px);
  display: flex; align-items: center; justify-content: center;
  z-index: 20;
}
.mask.hidden { display: none; }
.dialog {
  width: calc(100% - 36px);
  background: var(--panel);
  border-radius: 12px;
  box-shadow: var(--shadow-md);
  padding: 16px 16px 12px;
}
.dialog .dt { font-size: 14px; font-weight: 600; }
.dialog .dd {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.65; margin-top: 7px; word-break: break-word;
}
.dialog .da { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dialog button {
  height: 32px; padding: 0 14px; border-radius: 8px;
  font-family: inherit; font-size: 12px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
.dialog button:hover { background: var(--hover); }
.dialog button.primary { border: none; background: var(--accent); color: #fff; }
.dialog button.primary:hover { background: var(--accent-deep); }
.dialog button.danger { border: none; background: var(--danger); color: #fff; }
.dialog button.danger:hover { filter: brightness(1.06); }
/* 键盘焦点可见 */
:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 1px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-tidy" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.6"/><rect x="14" y="4" width="7" height="7" rx="1.6"/><rect x="3" y="15" width="7" height="5" rx="1.6"/><rect x="14" y="15" width="7" height="5" rx="1.6"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-newwin" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="12" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-ungroup" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="16" rx="2"/><path d="M15 8h5M15 12h5M15 16h3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
</svg>

<div class="panel" id="panel">
  <div class="identity">
    <input class="name-input" id="ws-name" maxlength="24" placeholder="为分组命名" title="回车保存分组名称">
    <div class="colors" id="colors"></div>
  </div>

  <div class="actions">
    <button class="act" data-act="organize"><svg class="ic"><use href="#i-tidy"/></svg><span class="t">智能标签整理</span><span class="desc">自动按域名归档</span></button>
    <button class="act" data-act="vertical"><svg class="ic"><use href="#i-side"/></svg><span class="t" id="vertical-label">切换为垂直标签栏</span></button>
    <button class="act" data-act="sort"><svg class="ic"><use href="#i-sort"/></svg><span class="t">标签页排序</span><span class="desc">按域名</span></button>
    <button class="act" data-act="newtab"><svg class="ic"><use href="#i-plus"/></svg><span class="t">在组内添加新标签页</span></button>
    <button class="act" data-act="newwin"><svg class="ic"><use href="#i-newwin"/></svg><span class="t">将标签页移至新窗口</span></button>
    <div class="sep"></div>
    <button class="act danger" data-act="closegroup"><svg class="ic"><use href="#i-close"/></svg><span class="t">关闭分组</span></button>
    <button class="act" data-act="ungroup"><svg class="ic"><use href="#i-ungroup"/></svg><span class="t">取消分组</span><span class="desc">保留标签</span></button>
    <button class="act danger" data-act="delete"><svg class="ic"><use href="#i-trash"/></svg><span class="t">删除分组</span><span class="desc">连同标签</span></button>
  </div>

  <div class="ws-title">工作区</div>
  <div class="workspaces" id="workspaces"></div>
  <button class="add-ws" id="add-ws">＋ 新建工作区</button>
  <div class="foot">您的标签页分组现在会自动保存。</div>
</div>

<div class="mask hidden" id="mask">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dt" id="dlg-title"></div>
    <div class="dd" id="dlg-desc"></div>
    <div class="da">
      <button id="dlg-cancel">取消</button>
      <button id="dlg-ok" class="danger">确定</button>
    </div>
  </div>
</div>

<script>
// 跟随 chrome 主题（浮层独立 webview，需自行读取设置）
try {
  const tc = window.__TAURI__ && window.__TAURI__.core;
  tc.invoke('get_settings').then(s => {
    if (s && (s.theme === 'dark' || (s.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches))) {
      document.documentElement.dataset.theme = 'dark';
    }
    document.documentElement.dataset.accent = (s && s.accent) || 'green';
  }).catch(() => {});
} catch {}

const core = window.__TAURI__.core;
const invoke = (cmd, args) => core.invoke(cmd, args || {});
const $ = (s) => document.querySelector(s);
const close = () => invoke('close_overlay').catch(() => {});
// 面板动作反馈：面板随即关闭，本浮层里的提示看不到——发给 chrome 的 ext-toast（P2-U4）
function panelToast(msg) {
  try { window.__TAURI__.event.emit('ext-toast', msg); } catch {}
}
const colorKey = (id) => 'trawl-ws-color-' + id;
const COLORS = ['', '#3b82f6', '#ef4444', '#b45309', '#16a34a', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#64748b'];
let st = null;

function colorOf(id) {
  try { return localStorage.getItem(colorKey(id)) || ''; } catch { return ''; }
}

function renderColors() {
  const cur = colorOf(st.activeWorkspace);
  const box = $('#colors');
  box.innerHTML = '';
  for (const c of COLORS) {
    const b = document.createElement('button');
    b.className = 'dot' + (c === '' ? ' none' : '') + (c === cur ? ' active' : '');
    if (c) b.style.setProperty('--c', c);
    b.title = c ? '分组配色' : '无配色';
    b.onclick = async () => {
      try { localStorage.setItem(colorKey(st.activeWorkspace), c); } catch {}
      renderColors();
      renderWorkspaces();
      // 借切换工作区触发一次 state 推送，让 chrome 上的分组圆点即时变色
      try { await invoke('switch_workspace_cmd', { id: st.activeWorkspace }); } catch {}
    };
    box.appendChild(b);
  }
}

function renderWorkspaces() {
  const box = $('#workspaces');
  box.innerHTML = '';
  for (const ws of st.workspaces) {
    const row = document.createElement('div');
    row.className = 'ws' + (ws.id === st.activeWorkspace ? ' on' : '');
    const bullet = document.createElement('span');
    bullet.className = 'bullet';
    bullet.style.background = colorOf(ws.id) || '#b6bec7';
    const name = document.createElement('span');
    name.className = 'n'; name.textContent = ws.name;
    const chk = document.createElement('span');
    chk.className = 'chk'; chk.textContent = '✓';
    row.appendChild(bullet); row.appendChild(name); row.appendChild(chk);
    row.onclick = async () => {
      if (ws.id === st.activeWorkspace) return;
      try { await invoke('switch_workspace_cmd', { id: ws.id }); } catch {}
      close();
    };
    box.appendChild(row);
  }
}

async function boot() {
  try { st = await invoke('initial_state'); } catch { return; }
  const cur = st.workspaces.find(w => w.id === st.activeWorkspace);
  $('#ws-name').value = cur ? cur.name : '';
  $('#vertical-label').textContent = st.settings && st.settings.verticalTabs
    ? '切换为水平标签栏' : '切换为垂直标签栏';
  renderColors();
  renderWorkspaces();
  requestAnimationFrame(() => {
    invoke('resize_overlay', { height: Math.ceil($('#panel').getBoundingClientRect().height) + 24 }).catch(() => {});
  });
}

$('#ws-name').addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    try { await invoke('rename_workspace', { id: st.activeWorkspace, name: $('#ws-name').value }); } catch {}
    close();
  }
  if (e.key === 'Escape') close();
});
$('#ws-name').addEventListener('blur', async () => {
  const v = $('#ws-name').value.trim();
  const cur = st.workspaces.find(w => w.id === st.activeWorkspace);
  if (cur && v && v !== cur.name) {
    try { await invoke('rename_workspace', { id: st.activeWorkspace, name: v }); } catch {}
  }
});

/* 面板内确认框（替代原生 confirm，避免 WebView2 被阻塞假死） */
let dlgResolve = null;
function askConfirm(opts) {
  const o = Object.assign({ title: '确认操作', desc: '', ok: '确定', danger: true }, opts || {});
  $('#dlg-title').textContent = o.title;
  $('#dlg-desc').textContent = o.desc;
  const ok = $('#dlg-ok');
  ok.textContent = o.ok;
  ok.className = o.danger ? 'danger' : 'primary';
  const mask = $('#mask');
  mask.classList.remove('hidden');
  return new Promise((resolve) => { dlgResolve = resolve; });
}
function answerConfirm(v) {
  $('#mask').classList.add('hidden');
  const r = dlgResolve; dlgResolve = null;
  if (r) r(v);
}
$('#dlg-ok').onclick = () => answerConfirm(true);
$('#dlg-cancel').onclick = () => answerConfirm(false);
$('#mask').onclick = (e) => { if (e.target === $('#mask')) answerConfirm(false); };

function currentName() {
  const cur = st && st.workspaces.find(w => w.id === st.activeWorkspace);
  return cur ? cur.name : '当前分组';
}

document.querySelectorAll('.act').forEach(btn => {
  btn.onclick = async () => {
    const act = btn.dataset.act;
    if (act === 'organize') {
      try { await invoke('smart_organize'); panelToast('已按域名智能整理标签'); }
      catch { panelToast('整理失败，请重试'); }
    }
    else if (act === 'vertical') {
      try { await invoke('toggle_vertical_tabs'); panelToast('已切换标签栏方向'); }
      catch { panelToast('切换失败，请重试'); }
    }
    else if (act === 'sort') {
      try { await invoke('sort_tabs', { mode: 'domain' }); panelToast('已按域名排序'); }
      catch { panelToast('排序失败，请重试'); }
    }
    else if (act === 'newtab') { await invoke('new_tab').catch(() => panelToast('新建标签页失败')); }
    else if (act === 'newwin') { await invoke('open_standalone_window', { incognito: false }).catch(() => panelToast('新建窗口失败')); }
    else if (act === 'closegroup') {
      const ok = await askConfirm({
        title: '关闭分组？',
        desc: `「${currentName()}」组内的所有标签页会被关闭，分组本身保留。`,
        ok: '关闭分组',
      });
      if (!ok) return;
      await invoke('close_group_tabs', { id: st.activeWorkspace }).catch(() => {});
    }
    else if (act === 'ungroup') {
      if (st.workspaces.length <= 1) {
        await askConfirm({
          title: '无需取消分组', desc: '当前只有一个分组，取消分组不会产生变化。',
          ok: '知道了', danger: false,
        });
        return;
      }
      const ok = await askConfirm({
        title: '取消分组？',
        desc: `「${currentName()}」里的标签页会保留，并合并到另一个分组。`,
        ok: '取消分组', danger: false,
      });
      if (!ok) return;
      await invoke('ungroup_workspace', { id: st.activeWorkspace }).catch(() => {});
    }
    else if (act === 'delete') {
      if (st.workspaces.length <= 1) {
        await askConfirm({
          title: '不能删除最后一个分组',
          desc: '至少需要保留一个分组。可以先新建一个分组，再回来删除这个。',
          ok: '知道了', danger: false,
        });
        return;
      }
      const ok = await askConfirm({
        title: '删除分组？',
        desc: `「${currentName()}」及其组内所有标签页都会被移除，此操作不可恢复。`,
        ok: '删除',
      });
      if (!ok) return;
      // 删除后当前分组已经不存在，直接收起面板，避免在失效状态上继续操作
      await invoke('close_workspace', { id: st.activeWorkspace }).catch(() => {});
      await close();
      return;
    }
    close();
  };
});

$('#add-ws').onclick = async () => { await invoke('new_workspace').catch(() => {}); close(); };
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#mask').classList.contains('hidden')) { answerConfirm(false); return; }
  close();
});
boot();
</script>
</body>
</html>
