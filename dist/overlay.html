<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>浮层</title>
<style>
:root {
  --accent: #10b981; --accent-deep: #0b8f66;
  --panel: #ffffff; --bg: #f6f9f7; --border: #dfe7e1;
  --text: #1f2937; --text-dim: #6b7280; --danger: #ef4444;
  --shadow-sm: 0 1px 3px rgba(16,24,40,.10);
  --shadow-md: 0 6px 20px rgba(16,24,40,.12);
}
/* 深色主题：浮层跟随 chrome 主题（由脚本读取 get_settings 设置 data-theme） */
:root[data-theme="dark"] {
  --panel: #262a31; --bg: #1d2025; --hover: rgba(255,255,255,.08);
  --divider: rgba(255,255,255,.09); --border: rgba(255,255,255,.12);
  --text: #e6e8eb; --text-dim: #98a2b3; --danger: #f87171;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.5);
  --shadow-md: 0 6px 20px rgba(0,0,0,.45);
}
/* 强调色四套（与 style.css 保持一致；浮层独立 webview 需自带规则） */
:root[data-accent="purple"] { --accent: #8b5cf6; --accent-deep: #6d4ff5; }
:root[data-accent="blue"]   { --accent: #3b82f6; --accent-deep: #2f6fe0; }
:root[data-accent="orange"] { --accent: #f59e0b; --accent-deep: #d97706; }
:root[data-accent="green"]  { --accent: #10b981; --accent-deep: #0b8f66; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
}
button, input { font-family: inherit; }
.hidden { display: none !important; }

/* 浮层 webview 的尺寸 == 面板尺寸，所以这里一律铺满，不再用 fixed 偏移 */
.panel {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600;
  flex-shrink: 0;
}
.head .count { font-size: 11px; color: var(--text-dim); font-weight: 400; }
.head button {
  margin-left: auto;
  border: none; background: var(--bg); color: var(--text-dim);
  border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px;
}
.head button:hover { background: var(--border); color: var(--text); }
.head button + button { margin-left: 0; }

.body { flex: 1; overflow-y: auto; padding: 8px; }
.empty { color: var(--text-dim); font-size: 12px; padding: 18px; text-align: center; }

.row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 13px; cursor: pointer;
}
.row:hover { background: var(--bg); }
.row .title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
.row .url {
  margin-left: auto; color: var(--text-dim); font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 45%; direction: rtl; text-align: left;
}
.row .del, .row .reveal {
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; font-size: 11px; flex-shrink: 0;
}
.row .del:hover { color: var(--danger); }
.row .reveal:hover { color: var(--accent-deep); }
/* 下载面板：取消 / 重试 操作按钮与引导文案 */
.row .dl-act {
  border: 1px solid var(--border); background: var(--bg); color: var(--text-dim);
  cursor: pointer; font-size: 11px; flex-shrink: 0; border-radius: 6px; padding: 3px 8px;
}
.row .dl-act:hover { border-color: var(--accent); color: var(--accent-deep); }
.row .dl-hint { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

/* 下载面板 */
.dl-main { min-width: 0; flex: 1; }
.dl-line1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dl-line1 .title {
  min-width: 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex-shrink: 1; font-size: 13px;
}
.dl-line1 .meta {
  flex-shrink: 0; color: var(--text-dim); font-size: 11px;
  white-space: nowrap;
}
.dl-line1 .meta.fail { color: var(--danger); }
.dl-line1 .meta.ok { color: var(--accent-deep); }
.dl-bar {
  height: 3px; margin-top: 5px; border-radius: 2px;
  background: var(--border); overflow: hidden;
}
.dl-bar i {
  display: block; height: 100%; width: 0;
  background: var(--accent); border-radius: 2px;
  transition: width .3s ease;
}
.dl-bar.indet i { width: 30%; animation: dlslide 1.2s ease-in-out infinite; }
@keyframes dlslide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

/* 书签面板的文件夹分组标题 */
.bm-group-head {
  padding: 8px 10px 4px;
  font-size: 12px; font-weight: 600; color: var(--accent-deep);
  border-bottom: 1px solid var(--border);
  margin-top: 4px;
}
/* 书签批量删除工具条 */
.bm-bulk-bar {
  display: flex; gap: 6px; padding: 4px 6px 8px;
  border-bottom: 1px solid var(--border); margin-bottom: 4px;
}
.bm-bulk-btn {
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer;
}
.bm-bulk-btn:hover { border-color: var(--accent); color: var(--accent-deep); }
.bm-bulk-btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.bm-bulk-btn:disabled { opacity: .45; cursor: not-allowed; }
.bm-bulk-btn:disabled:hover { border-color: var(--border); color: var(--danger); }
.bm-check { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.row.bm-row-selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* ============ 书签管理：Edge 风格双栏（左文件夹树 + 右列表） ============ */
.bm-layout { display: flex; height: 100%; min-height: 0; }
.bm-side {
  width: 172px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); padding: 10px 8px; gap: 8px;
  overflow-y: auto; background: color-mix(in srgb, var(--bg) 45%, transparent);
}
.bm-side-title { font-size: 14px; font-weight: 600; padding: 2px 6px; }
.bm-search {
  width: 100%; box-sizing: border-box; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); border-radius: 8px;
  padding: 7px 10px; font-size: 12px; outline: none;
}
.bm-search:focus { border-color: var(--accent); }
.bm-tree { display: flex; flex-direction: column; gap: 2px; }
.bm-tree-item {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border-radius: 7px; font-size: 12px; cursor: pointer; color: var(--text);
  white-space: nowrap; overflow: hidden;
}
.bm-tree-item:hover { background: var(--bg); }
.bm-tree-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-deep); font-weight: 600; }
.bm-tree-item .ti-ico { font-size: 12px; flex-shrink: 0; }
.bm-tree-item .ti-name { overflow: hidden; text-overflow: ellipsis; }
.bm-tree-item .ti-count { margin-left: auto; color: var(--text-dim); font-size: 11px; flex-shrink: 0; }
.bm-tree-indent { padding-left: 18px; }
.bm-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bm-main-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.bm-main-title { font-size: 14px; font-weight: 600; margin-right: auto; }
.bm-tool {
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap;
}
.bm-tool:hover { border-color: var(--accent); color: var(--accent-deep); }
.bm-tool.danger { color: var(--danger); }
.bm-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
.bm-fav-ico {
  width: 16px; height: 16px; min-width: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #fff; flex-shrink: 0;
}
.bm-fav-ico.folder { background: transparent; font-size: 13px; }
.bm-list .row { padding: 7px 8px; }
.bm-list .row .title { flex-shrink: 0; max-width: 42%; }
.bm-list .row .url { max-width: none; flex: 1; direction: ltr; text-align: left; }

/* 页内查找条 */
#findbar {
  width: 100%; height: 100%;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-md);
}
#findbar input {
  flex: 1; min-width: 0; height: 32px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  padding: 0 10px; font-size: 13px; outline: none;
}
#findbar input:focus { border-color: var(--accent); background: var(--panel); }
#findbar button {
  border: none; border-radius: 8px;
  background: var(--bg); color: var(--text-dim);
  padding: 7px 11px; font-size: 12px; cursor: pointer; flex-shrink: 0;
}
#findbar button:hover { background: var(--accent); color: #fff; }

/* 命令面板 */
#palette-input {
  width: 100%; height: 40px;
  border: none; border-bottom: 1px solid var(--border);
  background: transparent; color: var(--text);
  padding: 0 16px; font-size: 14px; outline: none;
  flex-shrink: 0;
}
.pitem {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 8px;
  font-size: 13px; cursor: pointer;
}
.pitem:hover, .pitem.on { background: var(--bg); }
.pitem .hint { margin-left: auto; color: var(--text-dim); font-size: 11px; }
/* 键盘焦点可见 */
:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 1px; }
</style>
</head>
<body>

<div id="findbar" class="hidden">
  <input id="find-input" type="text" placeholder="在页面中查找…（Enter 下一处）">
  <button id="find-next">下一处</button>
  <button id="find-close">关闭</button>
</div>

<div id="panel" class="panel hidden">
  <div class="head">
    <span id="panel-title">面板</span>
    <span id="panel-count" class="count"></span>
    <button id="panel-extra" class="hidden">清空</button>
    <button id="panel-close">关闭 (Esc)</button>
  </div>
  <div class="body" id="panel-body"></div>
</div>

<div id="palette" class="panel hidden">
  <input id="palette-input" type="text" placeholder="输入命令…">
  <div class="body" id="palette-list"></div>
</div>

<script>
// 跟随 chrome 主题（浮层独立 webview，需自行读取设置）
try {
  const core = window.__TAURI__.core;
  core.invoke('get_settings').then(s => {
    if (s && (s.theme === 'dark' || (s.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches))) {
      document.documentElement.dataset.theme = 'dark';
    }
    document.documentElement.dataset.accent = (s && s.accent) || 'green';
  }).catch(() => {});
} catch {}

const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);

// 内联右键菜单（overlay 是最上层浮层，内部 DOM 不会被遮挡）
function showBmMenu(x, y, items) {
  const old = document.getElementById('bm-inline-menu');
  if (old) old.remove();
  const menu = document.createElement('div');
  menu.id = 'bm-inline-menu';
  menu.style.cssText = 'position:fixed;z-index:9998;min-width:150px;background:var(--panel,#fff);border:1px solid var(--border);border-radius:9px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.2)';
  for (const it of items) {
    if (it.sep) { const s = document.createElement('div'); s.style.cssText = 'height:1px;background:var(--border);margin:4px 6px'; menu.appendChild(s); continue; }
    const el = document.createElement('div');
    el.textContent = it.label;
    el.style.cssText = 'padding:7px 10px;font-size:12px;border-radius:6px;cursor:pointer;color:' + (it.danger ? 'var(--danger,#c2410c)' : 'var(--text)');
    el.onmouseenter = () => el.style.background = 'var(--bg,#f5f6f8)';
    el.onmouseleave = () => el.style.background = '';
    el.onclick = () => { menu.remove(); it.run(); };
    menu.appendChild(el);
  }
  document.body.appendChild(menu);
  menu.style.left = Math.min(x, window.innerWidth - 165) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - items.length * 32 - 10) + 'px';
  const close = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('mousedown', close); } };
  setTimeout(() => document.addEventListener('mousedown', close), 0);
}

// 自绘输入框弹窗（替代原生 window.prompt），返回 Promise<string|null>
function askPrompt(title, defaultValue) {
  return new Promise(function (resolve) {
    var old = document.getElementById('ask-prompt-mask');
    if (old) old.remove();
    var done = false;
    function fin(v) { if (done) return; done = true; var w = document.getElementById('ask-prompt-mask'); if (w) w.remove(); resolve(v); }
    var wrap = document.createElement('div');
    wrap.id = 'ask-prompt-mask';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999';
    var box = document.createElement('div');
    box.style.cssText = 'background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:12px;padding:18px 20px;min-width:280px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.35)';
    var t = document.createElement('div'); t.textContent = title; t.style.cssText = 'margin-bottom:10px';
    var inp = document.createElement('input');
    inp.type = 'text'; inp.value = defaultValue || '';
    inp.style.cssText = 'width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid #374151;background:#111827;color:#e5e7eb;font-size:13px;outline:none';
    var bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:14px';
    function mk(label, primary) {
      var b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:6px 14px;border-radius:8px;border:1px solid #374151;background:' + (primary ? 'var(--accent-deep, #0b8f66)' : 'transparent') + ';color:' + (primary ? '#fff' : '#e5e7eb') + ';cursor:pointer;font-size:13px';
      b.onclick = function () { fin(primary ? inp.value.trim() : null); };
      return b;
    }
    bar.appendChild(mk('取消', false)); bar.appendChild(mk('确定', true));
    box.append(t, inp, bar); wrap.appendChild(box); document.body.appendChild(wrap);
    inp.focus(); inp.select();
    inp.onkeydown = function (e) { if (e.key === 'Enter') fin(inp.value.trim()); if (e.key === 'Escape') { e.stopPropagation(); fin(null); } };
    wrap.onclick = function (e) { if (e.target === wrap) fin(null); };
  });
}

// 自绘确认弹窗（替代原生 window.confirm），返回 Promise<boolean>
function askConfirm(msg) {
  return new Promise(function (resolve) {
    var old = document.getElementById('ask-confirm-mask');
    if (old) old.remove();
    var done = false;
    function fin(v) { if (done) return; done = true; var w = document.getElementById('ask-confirm-mask'); if (w) w.remove(); resolve(v); }
    var wrap = document.createElement('div');
    wrap.id = 'ask-confirm-mask';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999';
    var box = document.createElement('div');
    box.style.cssText = 'background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:12px;padding:18px 20px;max-width:320px;font-size:13px;line-height:1.6;box-shadow:0 12px 40px rgba(0,0,0,.35)';
    var p = document.createElement('div');
    p.textContent = msg;
    var bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:14px';
    function mk(label, primary) {
      var b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:6px 14px;border-radius:8px;border:1px solid #374151;background:' + (primary ? 'var(--accent-deep, #0b8f66)' : 'transparent') + ';color:' + (primary ? '#fff' : '#e5e7eb') + ';cursor:pointer;font-size:13px';
      b.onclick = function () { fin(primary); };
      return b;
    }
    var cancelBtn = mk('取消', false);
    bar.appendChild(cancelBtn);
    bar.appendChild(mk('确定', true));
    box.appendChild(p); box.appendChild(bar); wrap.appendChild(box);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) fin(false); });
    wrap.tabIndex = -1;
    document.body.appendChild(wrap);
    cancelBtn.focus();
    wrap.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); fin(false); } });
  });
}

const action = new URLSearchParams(location.search).get('action') || '';

let paletteItems = [];
let paletteIndex = 0;
let st = null;

// 轻提示：浮层内就地显示，供下载取消/重试反馈使用
function toast(msg) {
  let t = $('#dl-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'dl-toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

const closeOverlay = () => invoke('close_overlay').catch(() => {});
$('#panel-close').onclick = closeOverlay;
$('#find-close').onclick = closeOverlay;

document.addEventListener('keydown', (e) => {
  // askConfirm 打开时 Esc 只关对话框（其自身监听已处理），不关整个浮层
  if (document.getElementById('ask-confirm-mask')) {
    if (e.key === 'Escape') e.preventDefault();
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); }
});

function showPanel(title) {
  // 切换到任何面板都停掉下载轮询，避免它每秒把命令面板/查找条顶掉（M10）
  if (dlTimer) { clearInterval(dlTimer); dlTimer = null; }
  $('#findbar').classList.add('hidden');
  $('#palette').classList.add('hidden');
  $('#panel').classList.remove('hidden');
  $('#panel-title').textContent = title;
  // 默认 padding；书签双栏布局会自行置 0
  if ($('#panel-body')) $('#panel-body').style.padding = '';
}

async function loadState(force) {
  if (!st || force) { try { st = await invoke('initial_state'); } catch {} }
  return st;
}

/* ==================== 页内查找 ==================== */

function openFind() {
  if (dlTimer) { clearInterval(dlTimer); dlTimer = null; }
  $('#panel').classList.add('hidden');
  $('#palette').classList.add('hidden');
  $('#findbar').classList.remove('hidden');
  const i = $('#find-input');
  i.focus();
  const go = () => { const t = i.value.trim(); if (t) invoke('find_in_page', { text: t }).catch(() => {}); };
  $('#find-next').onclick = go;
  i.onkeydown = (e) => {
    if (e.key === 'Enter') go();
    if (e.key === 'Escape') closeOverlay();
  };
}

/* ==================== 历史 / 书签 / 下载 ==================== */

function row(title, sub, onClick, extra) {
  const el = document.createElement('div');
  el.className = 'row';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.innerHTML = '<span class="title"></span><span class="url"></span>';
  el.querySelector('.title').textContent = title;
  el.querySelector('.url').textContent = sub;
  if (extra) el.appendChild(extra);
  el.onclick = onClick;
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (typeof el.onclick === 'function') el.onclick(ev); }
  });
  return el;
}

async function openHistory() {
  showPanel('历史记录');
  $('#panel-extra').classList.remove('hidden');
  $('#panel-extra').textContent = '清空历史';
  $('#panel-extra').onclick = async () => {
    if (!(await askConfirm('确定清空全部历史记录吗？此操作不可撤销。'))) return;
    try { await invoke('clear_history'); }
    catch (e) { $('#panel-body').insertAdjacentHTML('afterbegin', '<div class="empty">清空失败，请重试</div>'); return; }
    st = null;
    openHistory();
  };
  const body = $('#panel-body');
  body.innerHTML = '';
  let items = [];
  try { items = await invoke('get_history'); } catch {}
  $('#panel-count').textContent = items.length ? items.length + ' 条' : '';
  if (!items.length) { body.innerHTML = '<div class="empty">还没有历史记录</div>'; return; }
  for (const h of items) {
    body.appendChild(row(h.title || '(无标题)', h.url, async () => {
      try { await invoke('navigate', { input: h.url }); }
      catch (err) { toast('打开失败，请重试'); return; }
      closeOverlay();
    }));
  }
}

let bmSelectMode = false;      // 书签面板是否处于批量选择模式
let bmSelected = new Set();    // 选中的书签 url
let bmCurrentFolder = null;    // 当前选中的目录（null=全部收藏夹）
let bmSearchText = '';         // 书签搜索词

// 把 folder 路径列表 + 书签构建成树：{ name, path, children:Map, bookmarks: [], count }
// folders 为后端独立存储的文件夹路径（含空文件夹）；老数据 folders 为空时从书签反推
function buildBmTreeAll(list, folders) {
  const root = { name: '全部收藏夹', path: '', children: new Map(), bookmarks: [], count: 0 };
  const ensure = (segs) => {
    let node = root, path = '';
    for (const seg of segs) {
      path = path ? path + '/' + seg : seg;
      if (!node.children.has(seg)) node.children.set(seg, { name: seg, path, children: new Map(), bookmarks: [], count: 0 });
      node = node.children.get(seg);
    }
    return node;
  };
  // 先按 folders 建骨架（含空文件夹）
  const folderPaths = new Set(folders || []);
  for (const b of list) if (b.folder) {
    const segs = b.folder.split('/').filter(Boolean);
    for (let i = 1; i <= segs.length; i++) folderPaths.add(segs.slice(0, i).join('/'));
  }
  for (const p of folderPaths) ensure(p.split('/').filter(Boolean));
  // 再挂书签
  for (const b of list) {
    const segs = b.folder ? b.folder.split('/').map(s => s.trim()).filter(Boolean) : [];
    ensure(segs).bookmarks.push(b);
  }
  const recount = (n) => { n.count = n.bookmarks.length; for (const c of n.children.values()) n.count += recount(c); return n.count; };
  recount(root);
  return root;
}
// 取某路径的节点（''=root）
function bmNodeAt(root, path) {
  if (!path) return root;
  let node = root;
  for (const s of path.split('/')) { node = node.children.get(s); if (!node) return root; }
  return node;
}
// 收集节点下所有书签（含子目录）
function bmCollect(node, acc) { acc.push(...node.bookmarks); for (const c of node.children.values()) bmCollect(c, acc); return acc; }
// 标签色块（按字符串稳定上色）
function bmFavColor(text) {
  let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) | 0;
  return `hsl(${Math.abs(h) % 360} 55% 52%)`;
}

async function openBookmarks() {
  showPanel('书签');
  $('#panel-extra').classList.add('hidden');   // 导入移到工具栏，隐藏通用「导入」按钮
  const s = await loadState(true);
  const body = $('#panel-body');
  body.innerHTML = '';
  body.style.padding = '0';                     // 双栏铺满
  const list = (s && s.bookmarks) || [];
  const folderPaths = (s && s.bookmarkFolders) || [];
  $('#panel-count').textContent = list.length ? list.length + ' 个' : '';
  const tree = buildBmTreeAll(list, folderPaths);

  // 校验当前目录仍存在
  if (bmCurrentFolder && !bmNodeAt(tree, bmCurrentFolder)) bmCurrentFolder = null;

  // ===== 双栏容器 =====
  const layout = document.createElement('div');
  layout.className = 'bm-layout';

  // ---------- 左栏：标题 + 搜索 + 文件夹树 ----------
  const side = document.createElement('div');
  side.className = 'bm-side';
  const sideTitle = document.createElement('div');
  sideTitle.className = 'bm-side-title';
  sideTitle.textContent = '收藏夹';
  side.appendChild(sideTitle);
  const search = document.createElement('input');
  search.className = 'bm-search';
  search.type = 'text';
  search.placeholder = '搜索收藏夹';
  search.value = bmSearchText;
  search.oninput = () => { bmSearchText = search.value.trim(); renderBmList(); };
  side.appendChild(search);
  const treeBox = document.createElement('div');
  treeBox.className = 'bm-tree';
  let mainTitle;  // 右栏标题节点，switchFolder 调用时已赋值
  // 轻量切换目录：只更新左栏高亮 + 右栏标题 + 右栏列表，不重建整面板（避免闪一下）
  // 注意 renderBmList 在下方定义，此处只是引用，调用时已就绪
  const switchFolder = (path) => {
    bmCurrentFolder = path || null;
    treeBox.querySelectorAll('.bm-tree-item').forEach((el, i) => {
      el.classList.toggle('active', el.dataset.bmPath === (bmCurrentFolder || ''));
    });
    const curName = bmCurrentFolder ? bmCurrentFolder.split('/').pop() : '收藏夹栏';
    mainTitle.textContent = curName;
    renderBmList();
  };
  // 树节点渲染（递归）
  const addTreeItem = (node, indent) => {
    const t = document.createElement('div');
    t.className = 'bm-tree-item' + (indent ? ' bm-tree-indent' : '') + (bmCurrentFolder === (node.path || null) ? ' active' : '');
    t.dataset.bmPath = node.path || '';
    t.innerHTML = '<span class="ti-ico"></span><span class="ti-name"></span><span class="ti-count"></span>';
    t.querySelector('.ti-ico').textContent = node.path ? '📁' : '★';
    t.querySelector('.ti-name').textContent = node.name;
    t.querySelector('.ti-count').textContent = node.count;
    t.title = node.name;
    t.onclick = () => switchFolder(node.path);
    // 文件夹右键：重命名 / 删除（根项「全部收藏夹」不可操作）
    if (node.path) {
      t.addEventListener('contextmenu', (e) => {
        e.preventDefault(); e.stopPropagation();
        showBmMenu(e.clientX, e.clientY, [
          { label: '重命名文件夹', run: async () => {
            const name = await askPrompt('重命名文件夹', node.name);
            if (!name || name === node.name) return;
            try { const ok = await invoke('rename_bookmark_folder', { old_path: node.path, new_name: name }); if (!ok) toast('重命名失败：名称重复或无效'); st = null; openBookmarks(); }
            catch (err) { toast('重命名失败：' + String(err)); }
          } },
          { label: '在此文件夹新建', run: async () => {
            const name = await askPrompt('新建子文件夹', '新文件夹');
            if (!name) return;
            try { const ok = await invoke('create_bookmark_folder', { parent: node.path, name }); if (!ok) toast('同名已存在'); st = null; openBookmarks(); }
            catch (err) { toast('新建失败：' + String(err)); }
          } },
          { sep: true },
          { label: '删除文件夹（书签移到上级）', danger: true, run: async () => {
            if (!(await askConfirm(`删除文件夹「${node.name}」？里面的书签会移到上级，不会删除。`))) return;
            try { await invoke('delete_bookmark_folder', { path: node.path }); if (bmCurrentFolder === node.path) bmCurrentFolder = ''; st = null; openBookmarks(); }
            catch (err) { toast('删除失败：' + String(err)); }
          } },
        ]);
      });
    }
    treeBox.appendChild(t);
    for (const c of [...node.children.values()].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'))) addTreeItem(c, indent + 1);
  };
  addTreeItem(tree, 0);
  side.appendChild(treeBox);
  layout.appendChild(side);

  // ---------- 右栏：标题 + 工具栏 + 列表 ----------
  const main = document.createElement('div');
  main.className = 'bm-main';
  const mainHead = document.createElement('div');
  mainHead.className = 'bm-main-head';
  const curName = bmCurrentFolder ? bmCurrentFolder.split('/').pop() : '收藏夹栏';
  mainTitle = document.createElement('span');
  mainTitle.className = 'bm-main-title';
  mainTitle.textContent = curName;
  mainHead.appendChild(mainTitle);
  // 工具栏按钮
  const mkTool = (label, fn, danger) => {
    const b = document.createElement('button');
    b.className = 'bm-tool' + (danger ? ' danger' : '');
    b.textContent = label;
    b.onclick = fn;
    return b;
  };
  mainHead.appendChild(mkTool('添加收藏夹', async () => {
    // overlay 是独立 webview，拿不到 renderer 的 toggleStar；直接读 state 里当前页并切收藏
    try {
      const cur = await loadState(false);
      const active = cur && (cur.tabs || []).find(t => t.id === cur.activeTab);
      if (!active || !active.url || active.url.startsWith('trawl://')) { toast('当前页无法收藏'); return; }
      await invoke('toggle_bookmark', { url: active.url, title: active.title || active.url });
      toast('已切换收藏状态');
      st = null; openBookmarks();
    } catch (e) { toast('收藏失败，请重试'); }
  }));
  mainHead.appendChild(mkTool('新建文件夹', async () => {
    const name = await askPrompt('新建文件夹（在当前目录下）', '新文件夹');
    if (!name) return;
    const parent = bmCurrentFolder || '';
    try {
      const ok = await invoke('create_bookmark_folder', { parent, name });
      if (!ok) { toast('同名文件夹已存在或名称无效'); return; }
      st = null; openBookmarks();
    } catch (e) { toast('新建失败：' + String(e)); }
  }));
  mainHead.appendChild(mkTool('导入书签', () => toggleImport()));
  mainHead.appendChild(mkTool(bmSelectMode ? '取消选择' : '批量删除', () => {
    bmSelectMode = !bmSelectMode; bmSelected = new Set(); openBookmarks();
  }));
  if (bmSelectMode && list.length) {
    mainHead.appendChild(mkTool('全选', () => {
      const cur = visibleBm();
      if (bmSelected.size === cur.length) bmSelected.clear(); else cur.forEach(b => bmSelected.add(b.url));
      renderBmList();
    }));
    mainHead.appendChild(mkTool(`删除选中${bmSelected.size ? ' ('+bmSelected.size+')' : ''}`, async () => {
      if (!bmSelected.size) return;
      if (!(await askConfirm(`确定删除选中的 ${bmSelected.size} 个书签？`))) return;
      try { await invoke('remove_bookmarks_batch', { urls: [...bmSelected] }); }
      catch (e) { for (const url of bmSelected) { try { await invoke('remove_bookmark', { url }); } catch {} } }
      bmSelected.clear(); bmSelectMode = false; st = null; openBookmarks();
    }, true));
  }
  main.appendChild(mainHead);

  const listBox = document.createElement('div');
  listBox.className = 'bm-list';
  main.appendChild(listBox);
  layout.appendChild(main);
  body.appendChild(layout);

  // 当前可见书签（按目录 + 搜索过滤）
  function visibleBm() {
    const node = bmNodeAt(tree, bmCurrentFolder);
    let bms = bmCollect(node, []);
    if (bmSearchText) {
      const q = bmSearchText.toLowerCase();
      bms = bms.filter(b => (b.title || '').toLowerCase().includes(q) || (b.url || '').toLowerCase().includes(q));
    }
    // 按标题去重（镜像站点）
    const seen = new Set();
    return bms.filter(b => { const k = (b.title || b.url).trim(); if (seen.has(k)) return false; seen.add(k); return true; });
  }

  // 渲染右栏列表（搜索时只重画列表，不重建整面板）
  function renderBmList() {
    listBox.innerHTML = '';
    const bms = visibleBm();
    if (!bms.length) {
      listBox.innerHTML = '<div class="empty">' + (bmSearchText ? '没有匹配的收藏夹' : '这个文件夹是空的') + '</div>';
      return;
    }
    for (const b of bms) {
      let extra;
      if (bmSelectMode) {
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'bm-check'; cb.checked = bmSelected.has(b.url);
        cb.onclick = (e) => { e.stopPropagation(); toggleBmSelected(b.url, listBox); };
        extra = cb;
      } else {
        const del = document.createElement('button');
        del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', '删除书签');
        del.onclick = async (e) => {
          e.stopPropagation();
          if (!(await askConfirm(`确定删除书签「${b.title || b.url}」？`))) return;
          try { await invoke('remove_bookmark', { url: b.url }); toast('已删除书签'); }
          catch (err) { toast('删除失败，请重试'); }
          st = null; openBookmarks();
        };
        extra = del;
      }
      const itemRow = row(b.title || '(无标题)', b.url, async () => {
        if (bmSelectMode) { toggleBmSelected(b.url, listBox); return; }
        try { await invoke('navigate', { input: b.url }); }
        catch (err) { toast('打开失败，请重试'); return; }
        closeOverlay();
      }, extra);
      // 左侧色块图标 + 标题（改造 row 的 title 前缀）
      const fav = document.createElement('span');
      fav.className = 'bm-fav-ico';
      fav.textContent = (b.title || '★').charAt(0).toUpperCase();
      fav.style.background = bmFavColor(b.title || b.url);
      itemRow.insertBefore(fav, itemRow.firstChild);
      itemRow.dataset.bmUrl = b.url;
      // 书签右键：改标题 / 移动到文件夹 / 删除
      if (!bmSelectMode) {
        itemRow.addEventListener('contextmenu', (e) => {
          e.preventDefault(); e.stopPropagation();
          const moveItems = [
            { label: '（根目录）', run: () => doMove('') },
          ];
          for (const fp of [...folderPaths].sort()) {
            if (fp === b.folder) continue;
            moveItems.push({ label: '📁 ' + fp, run: () => doMove(fp) });
          }
          async function doMove(target) {
            try { await invoke('move_bookmark', { url: b.url, target_folder: target }); st = null; openBookmarks(); }
            catch (err) { toast('移动失败：' + String(err)); }
          }
          showBmMenu(e.clientX, e.clientY, [
            { label: '改标题', run: async () => {
              const name = await askPrompt('修改书签标题', b.title || '');
              if (!name || name === b.title) return;
              try { await invoke('rename_bookmark', { url: b.url, new_title: name }); st = null; openBookmarks(); }
              catch (err) { toast('修改失败：' + String(err)); }
            } },
            { label: '移动到文件夹 ›', run: () => showBmMenu(e.clientX, e.clientY + 30, moveItems) },
            { sep: true },
            { label: '删除书签', danger: true, run: async () => {
              if (!(await askConfirm(`确定删除书签「${b.title || b.url}」？`))) return;
              try { await invoke('remove_bookmark', { url: b.url }); toast('已删除书签'); }
              catch (err) { toast('删除失败，请重试'); }
              st = null; openBookmarks();
            } },
          ]);
        });
      }
      if (bmSelectMode && bmSelected.has(b.url)) itemRow.classList.add('bm-row-selected');
      listBox.appendChild(itemRow);
    }
  }
  renderBmList();
}

// 切换单个书签选中态（只更新 DOM 与 Set，不整面板重绘，避免闪烁）
function toggleBmSelected(url, container) {
  if (bmSelected.has(url)) bmSelected.delete(url);
  else bmSelected.add(url);
  // 同步复选框与行高亮
  const scope = container || document;
  const rows = scope.querySelectorAll('.row');
  for (const r of rows) {
    if (r.dataset.bmUrl === url) {
      const cb = r.querySelector('.bm-check');
      if (cb) cb.checked = bmSelected.has(url);
      r.classList.toggle('bm-row-selected', bmSelected.has(url));
    }
  }
  // 更新删除按钮计数（Edge 双栏工具栏）
  const delBtn = document.querySelector('#panel-body .bm-tool.danger');
  if (delBtn && delBtn.textContent.startsWith('删除选中')) {
    delBtn.textContent = `删除选中${bmSelected.size ? ' (' + bmSelected.size + ')' : ''}`;
  }
}

/* ---------- 书签导入：Chrome / Edge / HTML 文件 ---------- */
function renderImportBlock(body) {
  const block = document.createElement('div');
  block.id = 'bm-import';
  block.style.cssText = 'display:block;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;margin:8px 10px;flex-shrink:0;';
  block.innerHTML =
    '<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">选择导入来源：</div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' +
    '<button class="imp-btn" data-src="chrome">从 Chrome 导入书签</button>' +
    '<button class="imp-btn" data-src="edge">从 Edge 导入书签</button>' +
    '<div style="display:flex;gap:6px">' +
    '<input id="bm-html-path" type="text" placeholder="或填写导出的书签 HTML 文件完整路径" style="flex:1;height:28px;border:1px solid var(--border);border-radius:7px;padding:0 8px;font:12px sans-serif;background:#fff;color:#1f2329">' +
    '<button class="imp-btn" id="bm-html-ok">导入</button></div></div>';
  const listEl = body.querySelector('.bm-list');
  if (listEl) body.insertBefore(block, listEl); else body.insertBefore(block, body.firstChild);
  const style = document.createElement('style');
  style.textContent = '.imp-btn{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font:12px sans-serif;cursor:pointer;padding:0 10px;text-align:left}.imp-btn:hover{border-color:var(--accent);color:var(--accent-deep)}';
  document.head.appendChild(style);
  block.querySelectorAll('.imp-btn[data-src]').forEach(btn => {
    btn.onclick = async () => {
      btn.textContent = '导入中…';
      try {
        const n = await invoke('import_bookmarks', { source: btn.dataset.src, path: null });
        block.remove();
        st = null;
        openBookmarks();
      } catch (e) {
        btn.textContent = btn.dataset.src === 'chrome' ? '从 Chrome 导入书签' : '从 Edge 导入书签';
        const err = document.createElement('div');
        err.style.cssText = 'font-size:11.5px;color:var(--danger, #c2410c);margin-top:6px;line-height:1.5';
        err.textContent = String(e).replace(/^.*\d:\s*/, '');
        block.appendChild(err);
      }
    };
  });
  block.querySelector('#bm-html-ok').onclick = async () => {
    const path = block.querySelector('#bm-html-path').value.trim();
    if (!path) return;
    try {
      await invoke('import_bookmarks', { source: 'html', path });
      block.remove();
      st = null;
      openBookmarks();
    } catch (e) {
      const err = document.createElement('div');
      err.style.cssText = 'font-size:11.5px;color:var(--danger, #c2410c);margin-top:6px;line-height:1.5';
      err.textContent = String(e).replace(/^.*\d:\s*/, '');
      block.appendChild(err);
    }
  };
}

function toggleImport() {
  const block = document.getElementById('bm-import');
  if (block) block.remove();
  else {
    // 插到右栏（工具栏下方、列表上方），兼容旧的 #panel-body 直接布局
    const main = document.querySelector('#panel-body .bm-main') || document.getElementById('panel-body');
    renderImportBlock(main);
  }
}

let dlTimer = null;

function fmtBytes(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}

async function openDownloads() {
  showPanel('下载');
  if (dlTimer) { clearInterval(dlTimer); dlTimer = null; }
  $('#panel-extra').classList.remove('hidden');
  $('#panel-extra').textContent = '清除已完成';
  $('#panel-extra').onclick = async () => {
    try { await invoke('clear_downloads'); }
    catch (e) { toast('清除下载记录失败，请重试'); return; }
    openDownloads();
  };
  const body = $('#panel-body');
  body.innerHTML = '';
  let list = [];
  try { list = await invoke('get_downloads'); } catch {}
  const running = list.filter(d => d.state === 'started').length;
  $('#panel-count').textContent = list.length
    ? list.length + ' 项' + (running ? ' · ' + running + ' 进行中' : '')
    : '';
  if (!list.length) { body.innerHTML = '<div class="empty">还没有下载记录</div>'; return; }
  for (const d of list) {
    const name = (d.path || d.url || '').split(/[\\/]/).pop() || d.url;
    const el = document.createElement('div');
    el.className = 'row';
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    const main = document.createElement('div');
    main.className = 'dl-main';
    const line1 = document.createElement('div');
    line1.className = 'dl-line1';
    const t = document.createElement('span');
    t.className = 'title';
    t.textContent = name;
    t.title = d.path || d.url;
    const meta = document.createElement('span');
    meta.className = 'meta';
    const bar = document.createElement('div');
    bar.className = 'dl-bar';
    const fill = document.createElement('i');
    bar.appendChild(fill);
    if (d.state === 'started') {
      if (d.total > 0) {
        const pct = Math.min(100, Math.round(d.received * 100 / d.total));
        meta.textContent = pct + '% · ' + fmtBytes(d.received) + '/' + fmtBytes(d.total);
        fill.style.width = pct + '%';
      } else {
        meta.textContent = '下载中 · ' + fmtBytes(d.received);
        bar.classList.add('indet');
      }
    } else if (d.state === 'done') {
      meta.className = 'meta ok';
      meta.textContent = d.received > 0 ? '已完成 · ' + fmtBytes(d.received) : '已完成';
    } else {
      meta.className = 'meta fail';
      // 显示后端给出的失败原因（兼容旧记录：没有 error 字段时显示未知错误）
      meta.textContent = '失败 · ' + (d.error || '未知错误');
      fill.style.width = '100%';
      fill.style.background = 'var(--danger, #dc2626)';
    }
    line1.appendChild(t);
    line1.appendChild(meta);
    main.appendChild(line1);
    main.appendChild(bar);
    el.appendChild(main);
    if (d.state === 'done') {
      // 已完成：保留原有「打开」按钮
      const extra = document.createElement('button');
      extra.className = 'reveal';
      extra.textContent = '打开';
      extra.onclick = (e) => {
        e.stopPropagation();
        invoke('reveal_download', { path: d.path })
          .catch(() => toast('打开文件失败，请检查路径'));
      };
      el.appendChild(extra);
    } else if (d.state === 'started') {
      // 进行中：有任务 id 才能取消（旧记录无 id 时不显示，避免误调）
      if (d.id) {
        const cancel = document.createElement('button');
        cancel.className = 'dl-act';
        cancel.textContent = '取消';
        cancel.onclick = async (e) => {
          e.stopPropagation();
          try {
            const ok = await invoke('download_cancel', { id: d.id });
            toast(ok ? '已取消下载' : '取消失败，请重试');
          } catch { toast('取消失败：命令暂不可用'); }
          openDownloads();
        };
        el.appendChild(cancel);
      }
    } else {
      // 失败：需要登录只给引导文案（重试只会反复失败），其余类型允许重试
      if (d.error === '需要登录') {
        const hint = document.createElement('span');
        hint.className = 'dl-hint';
        hint.textContent = '请先登录站点后重试';
        el.appendChild(hint);
      } else {
        const retry = document.createElement('button');
        retry.className = 'dl-act';
        retry.textContent = '重试';
        retry.onclick = async (e) => {
          e.stopPropagation();
          try {
            const ok = await invoke('download_retry', { url: d.url });
            toast(ok ? '已重新开始下载' : '重试失败，请重试');
          } catch { toast('重试失败：命令暂不可用'); }
          openDownloads();
        };
        el.appendChild(retry);
      }
    }
    el.onclick = () => {
      // 失败条目没有本地文件，reveal 必然失败——给反馈而不是静默吞掉
      invoke('reveal_download', { path: d.path })
        .catch(() => toast(d.state === 'failed' ? '下载失败，无法打开文件' : '打开文件失败，请检查路径'));
    };
    el.addEventListener('keydown', (ev) => {
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target === el) { ev.preventDefault(); el.click(); }
    });
    body.appendChild(el);
  }
  // 有进行中的下载时每秒自动刷新（面板切走后停止）
  if (running) {
    dlTimer = setInterval(() => {
      if ($('#panel-title').textContent !== '下载') { clearInterval(dlTimer); dlTimer = null; return; }
      openDownloads();
    }, 1000);
  }
}

/* ==================== 命令面板 ==================== */

function actions() {
  const s = st || { tabs: [], workspaces: [], settings: {} };
  const active = s.tabs.find(t => t.id === s.activeTab);
  const a = [
    ['新建标签页', 'Ctrl+T', () => invoke('new_tab')],
    ['地址栏 / 搜索', 'Ctrl+L', () => invoke('emit_shortcut', { what: 'address' })],
    ['历史记录', 'Ctrl+H', openHistory],
    ['页内查找', 'Ctrl+F', openFind],
    ['书签', 'Ctrl+Shift+B', openBookmarks],
    ['下载', '', openDownloads],
    ['设置', '', () => invoke('open_internal', { page: 'settings' })],
    ['新建工作区', '', () => invoke('new_workspace')],
    ['新建文件夹', '', () => invoke('create_folder', { name: '' })],
    ['页面放大', 'Ctrl+=', () => invoke('zoom_page', { delta: 0.1 })],
    ['页面缩小', 'Ctrl+-', () => invoke('zoom_page', { delta: -0.1 })],
    ['页面缩放重置', 'Ctrl+0', () => invoke('zoom_page', { delta: 0 })],
  ];
  if (active) {
    a.push(['固定 / 取消固定当前标签', '', () => invoke('toggle_pin', { id: active.id })]);
    a.push(['收藏当前页', 'Ctrl+D', () => invoke('toggle_bookmark', { url: active.url, title: active.title })]);
    a.push(['关闭当前标签页', '', () => invoke('close_tab_cmd', { id: active.id })]);
  }
  if (s.split) {
    a.push(['切换分屏方向', '', () => invoke('toggle_split_orientation')]);
    a.push(['退出分屏', 'Esc', () => invoke('exit_split')]);
  }
  for (const ws of s.workspaces || []) {
    if (ws.id === s.activeWorkspace) continue;
    a.push(['切换工作区：' + ws.name, '', () => invoke('switch_workspace_cmd', { id: ws.id })]);
  }
  a.push(['切换主题', '', () => {
    const settings = JSON.parse(JSON.stringify(s.settings || {}));
    settings.theme = settings.theme === 'light' ? 'dark' : 'light';
    invoke('save_settings', { settings }).catch(() => { /* 浮层即将关闭，失败静默记录到控制台即可 */ console.warn('save_settings failed'); });
  }]);
  return a;
}

async function openPalette() {
  if (dlTimer) { clearInterval(dlTimer); dlTimer = null; }
  $('#panel').classList.add('hidden');
  $('#findbar').classList.add('hidden');
  $('#palette').classList.remove('hidden');
  await loadState(true);
  const input = $('#palette-input');
  input.focus();
  function render(qv) {
    paletteItems = actions().filter(x => !qv || x[0].toLowerCase().includes(qv.toLowerCase()));
    paletteIndex = 0;
    const listEl = $('#palette-list');
    listEl.innerHTML = '';
    paletteItems.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'pitem' + (i === 0 ? ' on' : '');
      el.innerHTML = '<span></span><span class="hint"></span>';
      el.querySelector('span').textContent = it[0];
      el.querySelector('.hint').textContent = it[1] || '';
      el.onclick = () => { closeOverlay(); it[2](); };
      listEl.appendChild(el);
    });
  }
  render('');
  input.oninput = () => render(input.value.trim());
  input.onkeydown = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const d = e.key === 'ArrowDown' ? 1 : -1;
      paletteIndex = (paletteIndex + d + paletteItems.length) % paletteItems.length;
      [...$('#palette-list').children].forEach((c, i) => c.classList.toggle('on', i === paletteIndex));
      $('#palette-list').children[paletteIndex]?.scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const it = paletteItems[paletteIndex];
      if (it) { closeOverlay(); it[2](); }
    }
  };
}

/* ==================== 入口 ==================== */

(async () => {
  if (action === 'find') openFind();
  else if (action === 'history') await openHistory();
  else if (action === 'bookmarks') await openBookmarks();
  else if (action === 'downloads') await openDownloads();
  else if (action === 'palette') await openPalette();
  else closeOverlay();
})();
</script>

<script>
/* macOS 快捷键文案替换：改显示文本，不影响 JS 里的 e.ctrlKey 判断。
   用 MutationObserver 覆盖动态渲染的菜单项。 */
(function () {
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  if (!isMac) return;
  function fix(root) {
    var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var n;
    while ((n = walk.nextNode())) {
      if (n.nodeValue && (n.nodeValue.indexOf('Ctrl+') >= 0 || n.nodeValue.indexOf('Alt+') >= 0)) {
        n.nodeValue = n.nodeValue.replace(/Ctrl\+/g, '⌘').replace(/Alt\+/g, '⌥');
      }
    }
  }
  fix(document.body);
  try {
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        m.addedNodes.forEach(function (node) {
          if (node.nodeType === 1) fix(node);
          else if (node.nodeType === 3 && node.nodeValue && node.nodeValue.indexOf('Ctrl+') >= 0) {
            node.nodeValue = node.nodeValue.replace(/Ctrl\+/g, '⌘');
          }
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  } catch {}
})();
</script>
