<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>浮层</title>
<style>
:root {
  --accent: #10b981; --accent-deep: #0b8f66;
  --panel: #ffffff; --bg: #f6f9f7; --border: #dfe7e1;
  --text: #1f2937; --text-dim: #6b7280;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
}
button, input { font-family: inherit; }
.hidden { display: none !important; }

/* 浮层 webview 的尺寸 == 面板尺寸，所以这里一律铺满，不再用 fixed 偏移 */
.panel {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 16px 44px rgba(15,23,20,.22);
}
.head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600;
  flex-shrink: 0;
}
.head .count { font-size: 11px; color: var(--text-dim); font-weight: 400; }
.head button {
  margin-left: auto;
  border: none; background: var(--bg); color: var(--text-dim);
  border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px;
}
.head button:hover { background: var(--border); color: var(--text); }
.head button + button { margin-left: 0; }

.body { flex: 1; overflow-y: auto; padding: 8px; }
.empty { color: var(--text-dim); font-size: 12px; padding: 18px; text-align: center; }

.row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 13px; cursor: pointer;
}
.row:hover { background: var(--bg); }
.row .title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
.row .url {
  margin-left: auto; color: var(--text-dim); font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 45%; direction: rtl; text-align: left;
}
.row .del, .row .reveal {
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; font-size: 11px; flex-shrink: 0;
}
.row .del:hover { color: #dc2626; }
.row .reveal:hover { color: var(--accent-deep); }

/* 下载面板 */
.dl-main { min-width: 0; flex: 1; }
.dl-line1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dl-line1 .title {
  min-width: 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex-shrink: 1; font-size: 13px;
}
.dl-line1 .meta {
  flex-shrink: 0; color: var(--text-dim); font-size: 11px;
  white-space: nowrap;
}
.dl-line1 .meta.fail { color: #dc2626; }
.dl-line1 .meta.ok { color: var(--accent-deep); }
.dl-bar {
  height: 3px; margin-top: 5px; border-radius: 2px;
  background: var(--border); overflow: hidden;
}
.dl-bar i {
  display: block; height: 100%; width: 0;
  background: var(--accent); border-radius: 2px;
  transition: width .3s ease;
}
.dl-bar.indet i { width: 30%; animation: dlslide 1.2s ease-in-out infinite; }
@keyframes dlslide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

/* 页内查找条 */
#findbar {
  width: 100%; height: 100%;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(15,23,20,.18);
}
#findbar input {
  flex: 1; min-width: 0; height: 32px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  padding: 0 10px; font-size: 13px; outline: none;
}
#findbar input:focus { border-color: var(--accent); background: #fff; }
#findbar button {
  border: none; border-radius: 8px;
  background: var(--bg); color: var(--text-dim);
  padding: 7px 11px; font-size: 12px; cursor: pointer; flex-shrink: 0;
}
#findbar button:hover { background: var(--accent); color: #fff; }

/* 命令面板 */
#palette-input {
  width: 100%; height: 40px;
  border: none; border-bottom: 1px solid var(--border);
  background: transparent; color: var(--text);
  padding: 0 16px; font-size: 14px; outline: none;
  flex-shrink: 0;
}
.pitem {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 8px;
  font-size: 13px; cursor: pointer;
}
.pitem:hover, .pitem.on { background: var(--bg); }
.pitem .hint { margin-left: auto; color: var(--text-dim); font-size: 10px; }
</style>
</head>
<body>

<div id="findbar" class="hidden">
  <input id="find-input" type="text" placeholder="在页面中查找…（Enter 下一处）">
  <button id="find-next">下一处</button>
  <button id="find-close">关闭</button>
</div>

<div id="panel" class="panel hidden">
  <div class="head">
    <span id="panel-title">面板</span>
    <span id="panel-count" class="count"></span>
    <button id="panel-extra" class="hidden">清空</button>
    <button id="panel-close">关闭 (Esc)</button>
  </div>
  <div class="body" id="panel-body"></div>
</div>

<div id="palette" class="panel hidden">
  <input id="palette-input" type="text" placeholder="输入命令…">
  <div class="body" id="palette-list"></div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);
const action = new URLSearchParams(location.search).get('action') || '';

let paletteItems = [];
let paletteIndex = 0;
let st = null;

const closeOverlay = () => invoke('close_overlay').catch(() => {});
$('#panel-close').onclick = closeOverlay;
$('#find-close').onclick = closeOverlay;

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); }
});

function showPanel(title) {
  $('#findbar').classList.add('hidden');
  $('#palette').classList.add('hidden');
  $('#panel').classList.remove('hidden');
  $('#panel-title').textContent = title;
}

async function loadState(force) {
  if (!st || force) { try { st = await invoke('initial_state'); } catch {} }
  return st;
}

/* ==================== 页内查找 ==================== */

function openFind() {
  $('#panel').classList.add('hidden');
  $('#palette').classList.add('hidden');
  $('#findbar').classList.remove('hidden');
  const i = $('#find-input');
  i.focus();
  const go = () => { const t = i.value.trim(); if (t) invoke('find_in_page', { text: t }).catch(() => {}); };
  $('#find-next').onclick = go;
  i.onkeydown = (e) => {
    if (e.key === 'Enter') go();
    if (e.key === 'Escape') closeOverlay();
  };
}

/* ==================== 历史 / 书签 / 下载 ==================== */

function row(title, sub, onClick, extra) {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = '<span class="title"></span><span class="url"></span>';
  el.querySelector('.title').textContent = title;
  el.querySelector('.url').textContent = sub;
  if (extra) el.appendChild(extra);
  el.onclick = onClick;
  return el;
}

async function openHistory() {
  showPanel('历史记录');
  $('#panel-extra').classList.remove('hidden');
  $('#panel-extra').textContent = '清空历史';
  $('#panel-extra').onclick = async () => { await invoke('clear_history'); st = null; openHistory(); };
  const body = $('#panel-body');
  body.innerHTML = '';
  let items = [];
  try { items = await invoke('get_history'); } catch {}
  $('#panel-count').textContent = items.length ? items.length + ' 条' : '';
  if (!items.length) { body.innerHTML = '<div class="empty">还没有历史记录</div>'; return; }
  for (const h of items) {
    body.appendChild(row(h.title || '(无标题)', h.url, async () => {
      try { await invoke('navigate', { input: h.url }); } catch {}
      closeOverlay();
    }));
  }
}

async function openBookmarks() {
  showPanel('书签');
  $('#panel-extra').classList.remove('hidden');
  $('#panel-extra').textContent = '导入书签';
  $('#panel-extra').onclick = () => toggleImport();
  const s = await loadState(true);
  const body = $('#panel-body');
  body.innerHTML = '';
  renderImportBlock(body);
  const list = (s && s.bookmarks) || [];
  $('#panel-count').textContent = list.length ? list.length + ' 个' : '';
  if (!list.length) {
    body.insertAdjacentHTML('beforeend', '<div class="empty">还没有书签。在页面按 Ctrl+D 收藏当前页。</div>');
    return;
  }
  for (const b of list) {
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = async (e) => {
      e.stopPropagation();
      await invoke('remove_bookmark', { url: b.url });
      st = null;
      openBookmarks();
    };
    body.appendChild(row(b.title || '(无标题)', b.url, async () => {
      try { await invoke('navigate', { input: b.url }); } catch {}
      closeOverlay();
    }, del));
  }
}

/* ---------- 书签导入：Chrome / Edge / HTML 文件 ---------- */
function renderImportBlock(body) {
  const block = document.createElement('div');
  block.id = 'bm-import';
  block.style.cssText = 'display:none;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;margin-bottom:8px;';
  block.innerHTML =
    '<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">选择导入来源：</div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' +
    '<button class="imp-btn" data-src="chrome">从 Chrome 导入书签</button>' +
    '<button class="imp-btn" data-src="edge">从 Edge 导入书签</button>' +
    '<div style="display:flex;gap:6px">' +
    '<input id="bm-html-path" type="text" placeholder="或填写导出的书签 HTML 文件完整路径" style="flex:1;height:28px;border:1px solid var(--border);border-radius:7px;padding:0 8px;font:12px sans-serif;background:#fff;color:#1f2329">' +
    '<button class="imp-btn" id="bm-html-ok">导入</button></div></div>';
  body.insertBefore(block, body.firstChild);
  const style = document.createElement('style');
  style.textContent = '.imp-btn{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font:12px sans-serif;cursor:pointer;padding:0 10px;text-align:left}.imp-btn:hover{border-color:var(--accent);color:var(--accent-deep)}';
  document.head.appendChild(style);
  block.querySelectorAll('.imp-btn[data-src]').forEach(btn => {
    btn.onclick = async () => {
      btn.textContent = '导入中…';
      try {
        const n = await invoke('import_bookmarks', { source: btn.dataset.src, path: null });
        block.remove();
        st = null;
        openBookmarks();
      } catch (e) {
        btn.textContent = btn.dataset.src === 'chrome' ? '从 Chrome 导入书签' : '从 Edge 导入书签';
        const err = document.createElement('div');
        err.style.cssText = 'font-size:11.5px;color:#c2410c;margin-top:6px;line-height:1.5';
        err.textContent = String(e).replace(/^.*\d:\s*/, '');
        block.appendChild(err);
      }
    };
  });
  block.querySelector('#bm-html-ok').onclick = async () => {
    const path = block.querySelector('#bm-html-path').value.trim();
    if (!path) return;
    try {
      await invoke('import_bookmarks', { source: 'html', path });
      block.remove();
      st = null;
      openBookmarks();
    } catch (e) {
      const err = document.createElement('div');
      err.style.cssText = 'font-size:11.5px;color:#c2410c;margin-top:6px;line-height:1.5';
      err.textContent = String(e).replace(/^.*\d:\s*/, '');
      block.appendChild(err);
    }
  };
}

function toggleImport() {
  const block = document.getElementById('bm-import');
  if (block) block.remove();
  else renderImportBlock(document.getElementById('panel-body'));
}

let dlTimer = null;

function fmtBytes(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}

async function openDownloads() {
  showPanel('下载');
  if (dlTimer) { clearInterval(dlTimer); dlTimer = null; }
  $('#panel-extra').classList.remove('hidden');
  $('#panel-extra').textContent = '清除已完成';
  $('#panel-extra').onclick = async () => { await invoke('clear_downloads'); openDownloads(); };
  const body = $('#panel-body');
  body.innerHTML = '';
  let list = [];
  try { list = await invoke('get_downloads'); } catch {}
  const running = list.filter(d => d.state === 'started').length;
  $('#panel-count').textContent = list.length
    ? list.length + ' 项' + (running ? ' · ' + running + ' 进行中' : '')
    : '';
  if (!list.length) { body.innerHTML = '<div class="empty">还没有下载记录</div>'; return; }
  for (const d of list) {
    const name = (d.path || d.url || '').split(/[\\/]/).pop() || d.url;
    const el = document.createElement('div');
    el.className = 'row';
    const main = document.createElement('div');
    main.className = 'dl-main';
    const line1 = document.createElement('div');
    line1.className = 'dl-line1';
    const t = document.createElement('span');
    t.className = 'title';
    t.textContent = name;
    t.title = d.path || d.url;
    const meta = document.createElement('span');
    meta.className = 'meta';
    const bar = document.createElement('div');
    bar.className = 'dl-bar';
    const fill = document.createElement('i');
    bar.appendChild(fill);
    if (d.state === 'started') {
      if (d.total > 0) {
        const pct = Math.min(100, Math.round(d.received * 100 / d.total));
        meta.textContent = pct + '% · ' + fmtBytes(d.received) + '/' + fmtBytes(d.total);
        fill.style.width = pct + '%';
      } else {
        meta.textContent = '下载中 · ' + fmtBytes(d.received);
        bar.classList.add('indet');
      }
    } else if (d.state === 'done') {
      meta.className = 'meta ok';
      meta.textContent = d.received > 0 ? '已完成 · ' + fmtBytes(d.received) : '已完成';
    } else {
      meta.className = 'meta fail';
      meta.textContent = '失败';
      fill.style.width = '100%';
      fill.style.background = '#dc2626';
    }
    line1.appendChild(t);
    line1.appendChild(meta);
    main.appendChild(line1);
    main.appendChild(bar);
    el.appendChild(main);
    if (d.state === 'done') {
      const extra = document.createElement('button');
      extra.className = 'reveal';
      extra.textContent = '打开';
      extra.onclick = (e) => { e.stopPropagation(); invoke('reveal_download', { path: d.path }); };
      el.appendChild(extra);
    }
    el.onclick = () => invoke('reveal_download', { path: d.path });
    body.appendChild(el);
  }
  // 有进行中的下载时每秒自动刷新（面板切走后停止）
  if (running) {
    dlTimer = setInterval(() => {
      if ($('#panel-title').textContent !== '下载') { clearInterval(dlTimer); dlTimer = null; return; }
      openDownloads();
    }, 1000);
  }
}

/* ==================== 命令面板 ==================== */

function actions() {
  const s = st || { tabs: [], workspaces: [], settings: {} };
  const active = s.tabs.find(t => t.id === s.activeTab);
  const a = [
    ['新建标签页', 'Ctrl+T', () => invoke('new_tab')],
    ['地址栏 / 搜索', 'Ctrl+L', () => invoke('emit_shortcut', { what: 'address' })],
    ['历史记录', 'Ctrl+H', openHistory],
    ['页内查找', 'Ctrl+F', openFind],
    ['书签', 'Ctrl+Shift+B', openBookmarks],
    ['下载', '', openDownloads],
    ['设置', '', () => invoke('open_internal', { page: 'settings' })],
    ['新建工作区', '', () => invoke('new_workspace')],
    ['新建文件夹', '', () => invoke('create_folder', { name: '' })],
    ['页面放大', 'Ctrl+=', () => invoke('zoom_page', { delta: 0.1 })],
    ['页面缩小', 'Ctrl+-', () => invoke('zoom_page', { delta: -0.1 })],
    ['页面缩放重置', 'Ctrl+0', () => invoke('zoom_page', { delta: 0 })],
  ];
  if (active) {
    a.push(['固定 / 取消固定当前标签', '', () => invoke('toggle_pin', { id: active.id })]);
    a.push(['收藏当前页', 'Ctrl+D', () => invoke('toggle_bookmark', { url: active.url, title: active.title })]);
    a.push(['关闭当前标签页', '', () => invoke('close_tab_cmd', { id: active.id })]);
  }
  if (s.split) {
    a.push(['切换分屏方向', '', () => invoke('toggle_split_orientation')]);
    a.push(['退出分屏', 'Esc', () => invoke('exit_split')]);
  }
  for (const ws of s.workspaces || []) {
    if (ws.id === s.activeWorkspace) continue;
    a.push(['切换工作区：' + ws.name, '', () => invoke('switch_workspace_cmd', { id: ws.id })]);
  }
  a.push(['切换主题', '', () => {
    const settings = JSON.parse(JSON.stringify(s.settings || {}));
    settings.theme = settings.theme === 'light' ? 'dark' : 'light';
    invoke('save_settings', { settings });
  }]);
  return a;
}

async function openPalette() {
  $('#panel').classList.add('hidden');
  $('#findbar').classList.add('hidden');
  $('#palette').classList.remove('hidden');
  await loadState(true);
  const input = $('#palette-input');
  input.focus();
  function render(qv) {
    paletteItems = actions().filter(x => !qv || x[0].toLowerCase().includes(qv.toLowerCase()));
    paletteIndex = 0;
    const listEl = $('#palette-list');
    listEl.innerHTML = '';
    paletteItems.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'pitem' + (i === 0 ? ' on' : '');
      el.innerHTML = '<span></span><span class="hint"></span>';
      el.querySelector('span').textContent = it[0];
      el.querySelector('.hint').textContent = it[1] || '';
      el.onclick = () => { closeOverlay(); it[2](); };
      listEl.appendChild(el);
    });
  }
  render('');
  input.oninput = () => render(input.value.trim());
  input.onkeydown = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const d = e.key === 'ArrowDown' ? 1 : -1;
      paletteIndex = (paletteIndex + d + paletteItems.length) % paletteItems.length;
      [...$('#palette-list').children].forEach((c, i) => c.classList.toggle('on', i === paletteIndex));
      $('#palette-list').children[paletteIndex]?.scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const it = paletteItems[paletteIndex];
      if (it) { closeOverlay(); it[2](); }
    }
  };
}

/* ==================== 入口 ==================== */

(async () => {
  if (action === 'find') openFind();
  else if (action === 'history') await openHistory();
  else if (action === 'bookmarks') await openBookmarks();
  else if (action === 'downloads') await openDownloads();
  else if (action === 'palette') await openPalette();
  else closeOverlay();
})();
</script>
</body>
</html>
