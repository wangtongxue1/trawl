<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="green">
<head>
<meta charset="UTF-8">
<title>Trawl</title>
<link rel="stylesheet" href="style.css?v=0.7.15">
<style>
/* 更新提示条（Edge 式，右上角滑入） */
#update-banner {
  position: fixed; top: 104px; right: 14px; z-index: 900;
  display: flex; align-items: center; gap: 12px;
  width: 340px; padding: 14px 16px;
  background: #fff; color: #1f2329;
  border: 1px solid rgba(17,24,39,.10); border-radius: 12px;
  box-shadow: 0 12px 36px rgba(16,24,40,.24);
  transform: translateX(380px); opacity: 0;
  transition: transform .28s cubic-bezier(.2,.8,.25,1), opacity .28s ease;
}
#update-banner:not(.hidden) { transform: translateX(0); opacity: 1; }
#update-banner .ub-ic {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  background: rgba(16,185,129,.12); color: #10b981;
  display: grid; place-items: center;
}
#update-banner .ub-ic .ic { width: 18px; height: 18px; stroke-width: 1.8; }
#update-banner .ub-main { flex: 1; min-width: 0; }
#update-banner .ub-title { font-size: 13px; font-weight: 600; }
#update-banner .ub-desc { font-size: 11.5px; color: #7b8794; margin-top: 3px; line-height: 1.5; }
#update-banner .ub-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
#update-banner .ub-actions button {
  height: 26px; padding: 0 12px; border-radius: 7px;
  font-family: inherit; font-size: 11.5px; cursor: pointer; white-space: nowrap;
}
#ub-now { border: none; background: #10b981; color: #fff; }
#ub-now:hover { filter: brightness(1.08); }
#ub-later { border: 1px solid rgba(17,24,39,.14); background: transparent; color: #5a6672; }
#ub-later:hover { border-color: #10b981; color: #10b981; }
:root[data-theme="dark"] #update-banner { background: #1e2228; color: #e8ebef; border-color: #2c323a; }
:root[data-theme="dark"] #update-banner .ub-desc { color: #a9b3be; }
:root[data-theme="dark"] #ub-later { border-color: #3a424c; color: #a9b3be; }
:root[data-theme="dark"] #ub-later:hover { border-color: #10b981; color: #10b981; }
</style>
</head>
<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.9 6.3.8-4.6 4.4 1.2 6.2-5.6-3.1-5.6 3.1 1.2-6.2L3 9.7l6.3-.8z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13.5l9 5 9-5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h6"/></symbol>
    <symbol id="i-newwin" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="12" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></symbol>
    <symbol id="i-incognito" viewBox="0 0 24 24"><path d="M4 13h16"/><circle cx="8" cy="16.5" r="2.2"/><circle cx="16" cy="16.5" r="2.2"/><path d="M8 13c0-3 1.5-5 4-5s4 2 4 5"/></symbol>
    <symbol id="i-tidy" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.7 4.6L18.5 9.5l-4.8 1.9L12 16l-1.7-4.6L5.5 9.5l4.8-1.9z"/><path d="M18.5 16l.8 2.1 2.2.9-2.2.9-.8 2.1-.8-2.1-2.2-.9 2.2-.9z"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M10 3.5h4v2.1a1.8 1.8 0 1 0 3.6 0V3.5H21v4.9h-2.1a1.8 1.8 0 1 0 0 3.6H21v7.5h-5.2v-2.1a1.8 1.8 0 1 0-3.6 0v2.1H3V12h2.1a1.8 1.8 0 1 0 0-3.6H3V3.5h7z"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="M3 5.5h8.5M7.2 3.5v2c0 3.6-1.7 6.4-4.2 8.2"/><path d="M4.6 9.3c1.5 2.6 3.6 4 6.4 4.9"/><path d="M12.6 20.5l4-10.5 4 10.5"/><path d="M14.2 16.7h4.9"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M3.6 12a8.4 8.4 0 1 0 2.6-6.1"/><path d="M3.3 4.7v4.2H7.5"/><path d="M12 7.6V12l3.2 1.9"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" rx="1.5"/><path d="M8 8V5a1.5 1.5 0 0 1 1.5-1.5H19A1.5 1.5 0 0 1 20.5 5v9.5A1.5 1.5 0 0 1 19 16h-3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>

  <div id="chrome">
    <!-- 标签栏：左侧 Logo（点击出功能菜单）+ 标签 + 新建 + 弹性空白 + 标签列表 + 窗口按钮 -->
    <div id="tabstrip" data-tauri-drag-region="deep">
      <div id="ws-pill" title="Trawl 菜单">
        <img class="brand" src="logo/trawl-icon.svg" alt="Trawl">
        <svg class="ic chevron"><use href="#i-chevron"/></svg>
      </div>
      <div id="tabs"></div>
      <button id="btn-newtab" class="strip-ic" title="新建标签页 (Ctrl+T)"><svg class="ic"><use href="#i-plus"/></svg></button>
      <div class="strip-spacer"></div>
      <button id="btn-tablist" class="strip-ic" title="标签列表"><svg class="ic"><use href="#i-grid"/></svg></button>
      <div class="win-controls">
        <button id="win-min" title="最小化"><svg class="ic"><use href="#i-min"/></svg></button>
        <button id="win-max" title="最大化"><svg class="ic"><use href="#i-max"/></svg></button>
        <button id="win-close" class="close" title="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>

    <!-- 工具栏：导航组 | 地址栏 | 工具组 -->
    <div id="toolbar">
      <div class="nav-group">
        <button id="btn-back" title="后退 (Alt+←)"><svg class="ic"><use href="#i-back"/></svg></button>
        <button id="btn-fwd" title="前进 (Alt+→)"><svg class="ic"><use href="#i-fwd"/></svg></button>
        <button id="btn-reload" title="刷新 (Ctrl+R)"><svg class="ic"><use href="#i-reload"/></svg></button>
        <button id="btn-home" title="主页"><svg class="ic"><use href="#i-home"/></svg></button>
      </div>

      <div id="address-wrap">
        <span id="addr-scheme"><svg class="ic"><use href="#i-lock"/></svg></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="搜索，或输入网址" />
        <span id="addr-hint" class="hidden">回车打开</span>
        <!-- 地址栏内侧右侧：收藏 / 翻译 -->
        <div class="addr-actions">
          <button id="btn-star" title="收藏本页 (Ctrl+D)"><svg class="ic"><use href="#i-star"/></svg></button>
          <button id="btn-translate" title="翻译此页"><svg class="ic"><use href="#i-translate"/></svg></button>
        </div>
      </div>

      <div class="tool-group">
        <button id="btn-extensions" title="扩展程序"><svg class="ic"><use href="#i-puzzle"/></svg></button>
        <button id="btn-history" title="历史记录 (Ctrl+H)"><svg class="ic"><use href="#i-clock"/></svg></button>
        <button id="btn-dl" class="hidden" title="下载"><svg class="ic"><use href="#i-download"/></svg><span id="dl-count">0</span></button>
        <span class="tool-sep"></span>
        <button id="btn-more" title="更多"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>
    </div>

    <!-- 加载进度条，贴在地址栏下沿 -->
    <div id="progress"><i></i></div>

    <div id="bookmarkbar"></div>
  </div>

  <div id="context-menu" class="hidden"></div>

  <!-- 关闭确认插件：标签数达到阈值时弹出的整窗遮罩 -->
  <div id="close-guard" class="hidden">
    <div class="cg-dialog" role="dialog" aria-modal="true">
      <div class="cg-title">要全部关闭吗？</div>
      <div class="cg-desc" id="cg-desc"></div>
      <div class="cg-actions">
        <button id="cg-cancel">继续浏览</button>
        <button id="cg-ok" class="danger">全部关闭</button>
      </div>
    </div>
  </div>

  <!-- 更新提示（启动检测到新版本时显示） -->
  <div id="update-banner" class="hidden">
    <div class="ub-ic"><svg class="ic"><use href="#i-download"/></svg></div>
    <div class="ub-main">
      <div class="ub-title" id="ub-title">发现新版本</div>
      <div class="ub-desc" id="ub-desc"></div>
    </div>
    <div class="ub-actions">
      <button id="ub-now">立即更新</button>
      <button id="ub-later">以后再说</button>
    </div>
  </div>

  <div id="chrome-toast"></div>
  <script src="renderer.js?v=0.7.15"></script></body>
</html>
