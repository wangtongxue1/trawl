<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="green">
<head>
<meta charset="UTF-8">
<title>密码管理工具</title>
<style>
:root {
  --accent: #10b981; --accent-deep: #0b8f66;
  --bg: #f7faf8; --card: #ffffff; --hover: #eef2ef;
  --text: #1f2937; --text-dim: #6b7280; --border: #e3eae5;
  --danger: #ef4444;
}
:root[data-theme="dark"] {
  --bg: #16181d; --card: #1d2027; --hover: #242830;
  --text: #e5e7eb; --text-dim: #9ca3af; --border: #2e3440;
  --danger: #f87171;
}
/* 强调色四套（与 style.css 保持一致） */
:root[data-accent="purple"] { --accent: #8b5cf6; --accent-deep: #6d4ff5; }
:root[data-accent="blue"]   { --accent: #3b82f6; --accent-deep: #2f6fe0; }
:root[data-accent="orange"] { --accent: #f59e0b; --accent-deep: #d97706; }
:root[data-accent="green"]  { --accent: #10b981; --accent-deep: #0b8f66; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; overflow: hidden; font-size: 13px;
}

/* ============ 左侧导航 ============ */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 14px 10px;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 16px; }
.brand img { width: 26px; height: 26px; }
.brand b { font-size: 14px; }
.brand b i { color: var(--accent); font-style: normal; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 9px;
  color: var(--text-dim); cursor: pointer; user-select: none;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item.active { background: var(--hover); color: var(--accent-deep); font-weight: 600; }
:root[data-theme="dark"] .nav-item.active { color: var(--accent); }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; }
.sidebar-foot { margin-top: auto; padding: 10px; color: var(--text-dim); font-size: 11px; }

/* ============ 主区域 ============ */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { padding: 14px 26px 0; }
.search {
  width: min(560px, 100%); margin: 0 auto;
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 999px; padding: 8px 16px;
}
.search svg { width: 15px; height: 15px; color: var(--text-dim); flex-shrink: 0; }
.search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 13px; }
.content { flex: 1; overflow-y: auto; padding: 18px 26px 30px; }
.wrap { width: min(640px, 100%); margin: 0 auto; }

.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.page-head h1 { font-size: 17px; }
.tip { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }
.tip a { color: #2f6fd6; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.btn-add {
  background: var(--accent); color: #fff; border: none;
  height: 32px; padding: 0 18px; border-radius: 999px; font-size: 12px;
  display: inline-flex; align-items: center;
  cursor: pointer; font-weight: 600;
}
.btn-add:hover { background: var(--accent-deep); }

/* 站点列表 */
.site-list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.site-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.site-row:last-child { border-bottom: none; }
.site-row:hover { background: var(--hover); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.site-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-count { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
.chev { color: var(--text-dim); flex-shrink: 0; }
.chev svg { width: 14px; height: 14px; display: block; }

.empty { color: var(--text-dim); text-align: center; padding: 40px 0; }

/* 详情页 */
.detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.btn-back {
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; padding: 6px; border-radius: 8px;
  display: flex; align-items: center;
}
.btn-back:hover { background: var(--hover); color: var(--text); }
.btn-back svg { width: 16px; height: 16px; }
.detail-head .avatar { width: 34px; height: 34px; font-size: 16px; }
.detail-head h1 { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cred-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 14px;
}
.field { display: flex; gap: 12px; margin-bottom: 12px; }
.field:last-of-type { margin-bottom: 4px; }
.field .lab { width: 64px; flex-shrink: 0; color: var(--text-dim); font-size: 12px; padding-top: 8px; }
.field .val { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.fbox {
  flex: 1; min-width: 0; background: var(--hover);
  border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 12px; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.icbtn {
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; padding: 7px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center;
}
.icbtn:hover { background: var(--hover); color: var(--text); }
.icbtn svg { width: 14px; height: 14px; display: block; }
.card-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn-act {
  border: none; height: 32px; padding: 0 20px; border-radius: 999px;
  display: inline-flex; align-items: center;
  font-size: 12px; cursor: pointer; font-weight: 600;
}
.btn-act.pri { background: var(--accent); color: #fff; }
.btn-act.pri:hover { background: var(--accent-deep); }
.btn-act.dgr { background: transparent; color: var(--danger); border: 1px solid var(--border); }
.btn-act.dgr:hover { border-color: var(--danger); }

/* 检查 / 设置 复用 */
.sec-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
.sec-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.sec-row:last-child { border-bottom: none; }
.sec-row .info { flex: 1; min-width: 0; }
.sec-row .t { font-size: 13px; }
.sec-row .d { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
/* 检查结果条目：可点击跳转到对应站点详情 */
.sec-row.clickable { cursor: pointer; }
.sec-row.clickable:hover { background: var(--hover); }
.badge-warn { color: #b45309; font-weight: 700; }
.badge-ok { color: var(--accent-deep); font-weight: 700; }

/* 开关 */
.switch { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; border-radius: 999px;
  background: #c6cdd4; transition: .15s ease; cursor: pointer;
}
.switch .slider::before {
  content: ""; position: absolute; width: 15px; height: 15px;
  left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .15s ease;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(17px); }

/* 按钮 */
.btn-ghost {
  border: 1px solid var(--border); background: transparent;
  color: var(--text); padding: 6px 14px; border-radius: 9px;
  font-size: 12px; cursor: pointer;
}
.btn-ghost:hover { background: var(--hover); }

/* 对话框 */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.dialog { width: min(400px, 92vw); background: var(--card); border-radius: 16px; padding: 20px; }
.dialog h2 { font-size: 16px; margin-bottom: 6px; }
.dialog .dd { color: var(--text-dim); font-size: 12px; margin-bottom: 14px; }
.dialog input, .dialog textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 12px; font-size: 13px; margin-bottom: 10px;
  background: var(--bg); color: var(--text); outline: none;
  font-family: inherit;
}
.dialog input:focus, .dialog textarea:focus { border-color: var(--accent); }
.dialog .row-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

/* 轻提示 */
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
  background: #1f2937; color: #fff; padding: 9px 18px; border-radius: 999px;
  font-size: 12px; opacity: 0; pointer-events: none; transition: .2s ease; z-index: 99;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="logo/trawl-icon.svg" alt="">
      <b><i>T</i>rawl 密码管理工具</b>
    </div>
    <div class="nav-item active" data-view="pw"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>密码</div>
    <div class="nav-item" data-view="check"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>检查</div>
    <div class="nav-item" data-view="cfg"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>设置</div>
    <div class="sidebar-foot" id="store-foot">密码加密存储<br>仅本机当前用户可解密</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索密码">
      </div>
    </div>
    <div class="content">
      <div class="wrap" id="view-pw"></div>
      <div class="wrap hidden" id="view-check"></div>
      <div class="wrap hidden" id="view-cfg"></div>
    </div>
  </main>

  <div class="mask hidden" id="mask"><div class="dialog" id="dialog"></div></div>
  <div class="toast" id="toast"></div>

<script>
const core = window.__TAURI__.core;
const invoke = async (cmd, args) => core.invoke(cmd, args);
const $ = (id) => document.getElementById(id);

// 平台相关文案：Windows 用 DPAPI + Hello，macOS 用钥匙串 + Touch ID / 登录密码
const IS_MAC = navigator.userAgent.includes('Macintosh') || /Mac/i.test(navigator.platform || '');
const STORE_LABEL = IS_MAC ? 'macOS 钥匙串' : 'Windows DPAPI';
const AUTH_LABEL = IS_MAC ? 'Touch ID / 登录密码' : 'Windows Hello（登录密码 / PIN / 指纹 / 人脸）';
$('store-foot').innerHTML = `密码以 ${STORE_LABEL} 加密<br>仅本机当前用户可解密`;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

// 自绘确认框：复用 #mask + #dialog，返回 Promise<boolean>，替代原生 confirm（C3）
function confirmBox(title, msg, okText) {
  return new Promise(resolve => {
    const dlg = $('dialog');
    dlg.innerHTML = `<h2>${esc(title)}</h2>
      <div class="dd" style="white-space:pre-wrap">${esc(msg)}</div>
      <div class="row-btns">
        <button class="btn-ghost" id="cf-cancel">取消</button>
        <button class="btn-add" id="cf-ok">${esc(okText || '确定')}</button>
      </div>`;
    $('mask').classList.remove('hidden');
    const done = (v) => {
      $('mask').removeEventListener('mousedown', onMask);
      $('mask').classList.add('hidden');
      resolve(v);
    };
    const onMask = (e) => { if (e.target === $('mask')) done(false); };
    $('mask').addEventListener('mousedown', onMask);
    $('cf-cancel').onclick = () => done(false);
    $('cf-ok').onclick = () => done(true);
  });
}

function applyTheme() {
  try {
    document.documentElement.dataset.theme = localStorage.getItem('trawl-theme') || 'light';
    document.documentElement.dataset.accent = localStorage.getItem('trawl-accent') || 'green';
  } catch {}
}

/* ---------- 数据 ---------- */
let LIST = [];
let curView = 'pw';
let curSite = null;      // 详情页当前站点
let verifiedFor = null;  // 通过验证的站点（一次一个，进详情必验证）

const AVATAR_COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#10b981','#14b8a6','#3b82f6','#6366f1','#8b5cf6','#ec4899','#64748b'];
function hashColor(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function hostOf(site) {
  try { return new URL(site.includes('://') ? site : 'https://' + site).hostname; }
  catch { return site; }
}
function letterOf(site) { return hostOf(site).replace(/^www\./, '').charAt(0).toUpperCase() || '?'; }

let PW_LOAD_FAILED = false;
async function loadList() {
  try { LIST = await invoke('pw_list') || []; PW_LOAD_FAILED = false; }
  catch { LIST = []; PW_LOAD_FAILED = true; }
}

function groupBySite() {
  const q = ($('q').value || '').trim().toLowerCase();
  const map = new Map();
  for (const x of LIST) {
    if (q && !x.site.toLowerCase().includes(q) && !x.username.toLowerCase().includes(q)) continue;
    if (!map.has(x.site)) map.set(x.site, []);
    map.get(x.site).push(x);
  }
  return map;
}

/* ---------- 视图：密码列表 ---------- */
function renderList() {
  const view = $('view-pw');
  const map = groupBySite();
  const sites = [...map.keys()].sort();
  let html = `<div class="page-head"><h1>密码</h1><button class="btn-add" id="btn-add">添加</button></div>
    <div class="tip">您可以创建、保存和管理密码，以便轻松登录网站和应用。<a id="lnk-csv">导入浏览器导出的 CSV</a>。<br>点击任一站点进入详情前，需要通过本机身份验证（${AUTH_LABEL}）。</div>`;
  if (!sites.length) {
    html += `<div class="empty">${PW_LOAD_FAILED ? '密码数据加载失败（文件损坏或读取错误），请先排查，不要重新添加覆盖原数据。' : '还没有保存的密码。点「添加」手动保存，或从浏览器导出的 CSV 导入。'}</div>`;
  } else {
    html += `<div class="site-list">`;
    for (const s of sites) {
      const n = map.get(s).length;
      html += `<div class="site-row" data-site="${encodeURIComponent(s)}">
        <span class="avatar" style="background:${hashColor(s)}">${letterOf(s)}</span>
        <span class="site-name">${esc(s)}</span>
        ${n > 1 ? `<span class="site-count">${n} 个帐号</span>` : ''}
        <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
      </div>`;
    }
    html += `</div>`;
  }
  view.innerHTML = html;
  const add = $('btn-add');
  if (add) add.onclick = () => openEditDialog(null, null);
  const csv = $('lnk-csv');
  if (csv) csv.onclick = importCsv;
  view.querySelectorAll('.site-row').forEach(row => {
    row.onclick = () => openDetail(decodeURIComponent(row.dataset.site));
  });
}

/* ---------- 身份验证（Windows Hello / macOS Touch ID / 本机密码） ---------- */
async function gate() {
  let needVerify = true;
  try { needVerify = localStorage.getItem('trawl-pw-verify') !== '0'; } catch {}
  if (!needVerify) {
    // 用户主动关闭了验证：前端放行后，后端也要解锁 pw_reveal（否则显示/复制会失败）
    await invoke('pw_confirm_insecure').catch(() => {});
    return true;
  }
  const r = await invoke('verify_user_consent');
  if (r === 'verified') return true;
  if (r === 'not_available') {
    const hint = IS_MAC
      ? '本机未启用 Touch ID / 登录密码验证。\n\n仍要查看该站点的密码吗？\n（可在「系统设置 → 用户与群组」设置登录密码以启用验证）'
      : '本机未配置 Windows Hello / PIN，无法验证身份。\n\n仍要查看该站点的密码吗？\n（可在系统设置 → 帐户 → 登录选项中配置 PIN 以启用验证）';
    if (!(await confirmBox('需要确认', hint, '仍要查看'))) return false;
    // 用户显式确认后解锁后端 pw_reveal（与 gate 放行保持一致）
    await invoke('pw_confirm_insecure').catch(() => {});
    return true;
  }
  toast('身份验证未通过');
  return false;
}

/* ---------- 视图：站点详情 ---------- */
async function openDetail(site) {
  if (!(await gate())) return;
  curSite = site;
  renderDetail();
}

function renderDetail() {
  const view = $('view-pw');
  const items = LIST.filter(x => x.site === curSite);
  let html = `<div class="detail-head">
      <button class="btn-back" id="btn-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
      <span class="avatar" style="background:${hashColor(curSite)}">${letterOf(curSite)}</span>
      <h1>${esc(curSite)}</h1>
      <button class="btn-ghost" id="btn-reverify" style="margin-left:auto">重新验证</button>
    </div>`;
  for (const it of items) {
    html += `<div class="cred-card" data-id="${it.id}">
      <div class="field"><span class="lab">用户名</span>
        <div class="val"><div class="fbox" data-f="user">${esc(it.username)}</div>
          <button class="icbtn" data-act="copy" data-src="user" title="复制用户名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
        </div></div>
      <div class="field"><span class="lab">网站</span>
        <div class="val"><div class="fbox" data-f="site">${esc(it.site)}</div>
          <button class="icbtn" data-act="copy" data-src="site" title="复制网址"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
        </div></div>
      <div class="field"><span class="lab">密码</span>
        <div class="val"><div class="fbox" data-f="pass">••••••••</div>
          <button class="icbtn" data-act="reveal" title="显示 / 隐藏密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="icbtn" data-act="copy" data-src="pass" title="复制密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
        </div></div>
      <div class="field"><span class="lab">备注</span>
        <div class="val"><div class="fbox" data-f="note">${it.note ? esc(it.note) : '未添加任何备注'}</div></div></div>
      <div class="card-actions">
        <button class="btn-act pri" data-act="edit">修改</button>
        <button class="btn-act dgr" data-act="del">删除</button>
      </div>
    </div>`;
  }
  view.innerHTML = html;
  $('btn-back').onclick = () => { curSite = null; renderList(); };
  // 验证过期后 pw_reveal 会失败，这里提供原地恢复入口（C14）
  $('btn-reverify').onclick = async () => {
    if (await gate()) { toast('验证通过，已刷新'); renderDetail(); }
  };
  view.querySelectorAll('.cred-card').forEach(card => {
    const id = card.dataset.id;
    const item = LIST.find(x => x.id === id);
    card.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = async (e) => {
        const act = btn.dataset.act;
        if (act === 'copy') {
          const src = btn.dataset.src;
          // 密码不再随列表下发，按需取（后端校验近期验证状态）
          let text = src === 'user' ? item.username : item.site;
          if (src === 'pass') {
            try { text = await invoke('pw_reveal', { id }); }
            catch (err) { toast(String(err).includes('验证') ? '请先通过本机身份验证' : '读取失败'); return; }
          }
          try { await navigator.clipboard.writeText(text || ''); toast('已复制'); } catch { toast('复制失败'); }
        } else if (act === 'reveal') {
          const box = card.querySelector('[data-f="pass"]');
          const shown = box.dataset.shown === '1';
          if (shown) { box.textContent = '••••••••'; box.dataset.shown = '0'; }
          else {
            try {
              box.textContent = await invoke('pw_reveal', { id });
              box.dataset.shown = '1';
            } catch (err) { toast(String(err).includes('验证') ? '请先通过本机身份验证' : '读取失败'); }
          }
        } else if (act === 'edit') {
          openEditDialog(id, item);
        } else if (act === 'del') {
          if (await confirmBox('删除密码', '确定删除 ' + item.site + ' 的这条密码？', '删除')) {
            await invoke('pw_del', { id });
            await loadList();
            toast('已删除');
            if (!LIST.some(x => x.site === curSite)) { curSite = null; renderList(); }
            else renderDetail();
          }
        }
        e.stopPropagation();
      };
    });
  });
}

/* ---------- 添加 / 修改对话框 ---------- */
async function openEditDialog(id, item) {
  const isEdit = !!item;
  // 编辑需要预填密码：按需取明文（后端校验近期验证状态）
  let editPass = '';
  if (isEdit) {
    try { editPass = await invoke('pw_reveal', { id }); }
    catch (err) { toast(String(err).includes('验证') ? '请先通过本机身份验证' : '读取失败'); return; }
  }
  const dlg = $('dialog');
  dlg.innerHTML = `<h2>${isEdit ? '修改密码' : '添加密码'}</h2>
    <div class="dd">${isEdit ? esc(item.site) : `保存后密码以 ${STORE_LABEL} 加密，仅本机可解密。`}</div>
    ${isEdit ? '' : '<input id="d-site" placeholder="网站（如 https://github.com）">'}
    <input id="d-user" placeholder="用户名" value="${isEdit ? esc(item.username) : ''}">
    <input id="d-pass" type="password" placeholder="密码" value="${isEdit ? esc(editPass) : ''}">
    <textarea id="d-note" rows="2" placeholder="备注（可选）">${isEdit ? esc(item.note || '') : ''}</textarea>
    <div class="row-btns">
      <button class="btn-ghost" id="d-cancel">取消</button>
      <button class="btn-add" id="d-ok">${isEdit ? '保存' : '添加'}</button>
    </div>`;
  $('mask').classList.remove('hidden');
  $('d-cancel').onclick = () => $('mask').classList.add('hidden');
  $('d-ok').onclick = async () => {
    const site = isEdit ? item.site : ($('d-site').value || '').trim();
    const user = $('d-user').value || '';
    const pass = $('d-pass').value || '';
    const note = $('d-note').value || '';
    if (!site) { toast('网站不能为空'); return; }
    if (!pass) { toast('密码不能为空'); return; }
    try {
      if (isEdit) await invoke('pw_update', { id: item.id, username: user, password: pass, note });
      else await invoke('pw_add', { site, username: user, password: pass, note });
      $('mask').classList.add('hidden');
      await loadList();
      toast(isEdit ? '已保存' : '已添加');
      curSite = isEdit && curSite ? curSite : (isEdit ? curSite : site);
      if (curSite && LIST.some(x => x.site === curSite)) renderDetail();
      else { curSite = null; renderList(); }
    } catch (e) { toast('保存失败: ' + e); }
  };
}

/* ---------- 视图：检查 ---------- */
// 从检查结果跳转到站点详情：切回密码视图，再交给 openDetail 走验证流程
function checkGoSite(site) {
  if (!site) return;
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.view === 'pw'));
  curView = 'pw';
  ['pw', 'check', 'cfg'].forEach(v => { $('view-' + v).classList.toggle('hidden', v !== 'pw'); });
  openDetail(site);
}

async function renderCheck() {
  const view = $('view-check');
  // 安全检查在后端完成，只返回重复/弱口令的条目 id，不返回明文
  let result;
  try { result = await invoke('pw_check'); }
  catch { result = { need_verify: true, reused: [], weak: [] }; }
  if (result.need_verify) {
    view.innerHTML = `<div class="page-head"><h1>密码检查</h1></div>
      <div class="tip">安全检查需要读取已保存密码，请先通过本机身份验证。</div>
      <button class="btn-add" id="check-verify">验证并检查</button>`;
    $('check-verify').onclick = async () => {
      const r = await invoke('verify_user_consent');
      if (r === 'verified') { renderCheck(); return; }
      if (r === 'not_available') {
        if (!(await confirmBox('需要确认', '本机未启用身份验证。仍要在显式确认后进行安全检查吗？', '仍要检查'))) return;
        await invoke('pw_confirm_insecure').catch(() => {});
        renderCheck();
        return;
      }
      toast('身份验证未通过');
    };
    return;
  }
  const byId = new Map(LIST.map(x => [x.id, x]));
  const dup = (result.reused || []).map(ids => ids.map(id => byId.get(id)).filter(Boolean));
  const weak = (result.weak || []).map(id => byId.get(id)).filter(Boolean);
  let html = `<div class="page-head"><h1>密码检查</h1></div>
    <div class="tip">对本机保存的密码做安全检查：是否有重复使用、是否过于简单。</div>
    <div class="sec-card">
      <div class="sec-row"><div class="info"><div class="t">共保存 ${LIST.length} 条密码</div>
        <div class="d">全部以 ${STORE_LABEL} 加密存储在本机。</div></div>
        <span class="badge-ok">${LIST.length ? '已加载' : '无数据'}</span></div>
      <div class="sec-row"><div class="info"><div class="t">重复使用的密码</div>
        <div class="d">多个站点使用同一密码会在其中之一泄露时波及其余站点。</div></div>
        <span class="${dup.length ? 'badge-warn' : 'badge-ok'}">${dup.length} 组</span></div>
      <div class="sec-row"><div class="info"><div class="t">强度不足的密码</div>
        <div class="d">长度不足 8 位，或使用了常见弱口令。</div></div>
        <span class="${weak.length ? 'badge-warn' : 'badge-ok'}">${weak.length} 条</span></div>
    </div>`;
  if (dup.length) {
    html += `<div class="sec-card">`;
    for (const group of dup) {
      // 同一密码的多个站点：取组内第一个站点作为跳转目标
      const target = group[0] && group[0].site;
      html += `<div class="sec-row clickable" data-site="${encodeURIComponent(target || '')}"><div class="info"><div class="t">${esc(group.map(x => hostOf(x.site)).join('、'))}</div>
        <div class="d">${group.length} 个站点使用同一密码，建议修改区分。点击前往 →</div></div></div>`;
    }
    html += `</div>`;
  }
  if (weak.length) {
    html += `<div class="sec-card">`;
    for (const x of weak) {
      html += `<div class="sec-row clickable" data-site="${encodeURIComponent(x.site)}"><div class="info"><div class="t">${esc(x.site)}（${esc(x.username)}）</div>
        <div class="d">密码强度不足，建议进入详情修改。点击前往 →</div></div></div>`;
    }
    html += `</div>`;
  }
  view.innerHTML = html;
  view.querySelectorAll('.sec-row[data-site]').forEach(row => {
    row.onclick = () => checkGoSite(decodeURIComponent(row.dataset.site || ''));
  });
}

/* ---------- 视图：设置 ---------- */
function renderCfg() {
  const view = $('view-cfg');
  let on = true;
  try { on = localStorage.getItem('trawl-pw-verify') !== '0'; } catch {}
  view.innerHTML = `<div class="page-head"><h1>设置</h1></div>
    <div class="tip">密码数据保存在本机（${STORE_LABEL} 加密），不经过任何服务器。</div>
    <div class="sec-card">
      <div class="sec-row"><div class="info"><div class="t">进入详情前验证本机身份</div>
        <div class="d">点击站点查看密码时，弹出 ${AUTH_LABEL} 验证。</div></div>
        <label class="switch"><input type="checkbox" id="cfg-verify" ${on ? 'checked' : ''}><span class="slider"></span></label></div>
      <div class="sec-row"><div class="info"><div class="t">从 CSV 导入密码</div>
        <div class="d">支持 Chrome / Edge 导出的密码 CSV 文件（name,url,username,password）。</div></div>
        <button class="btn-ghost" id="cfg-csv">导入</button></div>
      <div class="sec-row"><div class="info"><div class="t">数据存放目录</div>
        <div class="d">passwords.json 与其他浏览器数据在同一目录。</div></div>
        <button class="btn-ghost" id="cfg-dir">打开目录</button></div>
    </div>`;
  $('cfg-verify').onchange = (e) => {
    try { localStorage.setItem('trawl-pw-verify', e.target.checked ? '1' : '0'); } catch {}
    toast(e.target.checked ? '已开启身份验证' : '已关闭身份验证');
  };
  $('cfg-csv').onclick = importCsv;
  $('cfg-dir').onclick = () => invoke('open_data_dir').catch(() => {});
}

async function importCsv() {
  // 手输/粘贴路径始终可用；dialog 插件可用时额外提供「选择文件」按钮（C9）
  const hasDialog = !!(window.__TAURI__ && window.__TAURI__.dialog && window.__TAURI__.dialog.open);
  const dlg = $('dialog');
  dlg.innerHTML = `<h2>导入密码 CSV</h2>
    <div class="dd">在 Chrome / Edge 的密码管理器中「导出密码」得到 CSV，把完整文件路径粘贴到这里${hasDialog ? '，或点「选择文件」' : ''}。</div>
    <input id="d-csv" placeholder="例如 C:\\Users\\你\\Downloads\\passwords.csv">
    ${hasDialog ? '<div class="row-btns" style="justify-content:flex-start"><button class="btn-ghost" id="d-pick">选择文件</button></div>' : ''}
    <div class="row-btns">
      <button class="btn-ghost" id="d-cancel">取消</button>
      <button class="btn-add" id="d-ok">导入</button>
    </div>`;
  $('mask').classList.remove('hidden');
  $('d-cancel').onclick = () => $('mask').classList.add('hidden');
  if (hasDialog) {
    $('d-pick').onclick = async () => {
      try {
        const picked = await window.__TAURI__.dialog.open({
          multiple: false,
          filters: [{ name: 'CSV 文件', extensions: ['csv'] }]
        });
        const path = Array.isArray(picked) ? picked[0] : picked;
        if (path) $('d-csv').value = path;
      } catch (e) { toast('选择文件失败：' + e); }
    };
  }
  $('d-ok').onclick = async () => {
    const path = ($('d-csv').value || '').trim();
    if (!path) { toast('请先填写 CSV 文件路径'); return; }
    try {
      const n = await invoke('pw_import_csv', { path });
      $('mask').classList.add('hidden');
      await loadList();
      toast('已导入 ' + n + ' 条密码');
      renderView();
    } catch (e) { toast('导入失败: ' + e); }
  };
  $('d-csv').focus();
}

/* ---------- 导航与事件 ---------- */
function renderView() {
  if (curView === 'pw') { curSite ? renderDetail() : renderList(); }
  else if (curView === 'check') renderCheck();
  else if (curView === 'cfg') renderCfg();
}

document.querySelectorAll('.nav-item').forEach(it => {
  it.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    it.classList.add('active');
    curView = it.dataset.view;
    curSite = null;
    ['pw', 'check', 'cfg'].forEach(v => {
      $('view-' + v).classList.toggle('hidden', v !== curView);
    });
    renderView();
  };
});

$('q').addEventListener('input', () => { if (curView === 'pw' && !curSite) renderList(); });
$('mask').addEventListener('mousedown', (e) => { if (e.target === $('mask')) $('mask').classList.add('hidden'); });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(async () => {
  applyTheme();
  await loadList();
  renderView();
})();
</script>
</body>
</html>
