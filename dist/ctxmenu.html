<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>右键菜单</title>
<style>
:root {
  --panel: #ffffff; --hover: rgba(17,24,39,.06);
  --border: rgba(17,24,39,.10); --divider: rgba(17,24,39,.07);
  --text: #1f2329; --text-dim: #6b7785;
  --shadow-sm: 0 1px 3px rgba(16,24,40,.10);
  --shadow-md: 0 6px 20px rgba(16,24,40,.12);
}
:root[data-theme="dark"] {
  --panel: #23272e; --hover: rgba(255,255,255,.09);
  --border: rgba(255,255,255,.12); --divider: rgba(255,255,255,.08);
  --text: #e6e8eb; --text-dim: #98a2b3;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.5);
  --shadow-md: 0 6px 20px rgba(0,0,0,.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text); user-select: none; overflow: hidden;
  padding: 6px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-md);
  padding: 6px;
}
/* 书签下拉模式：限高滚动（Edge 风格） */
.card.bm-mode { max-height: calc(100vh - 24px); overflow-y: auto; overflow-x: hidden; padding: 5px; }
.card.bm-mode::-webkit-scrollbar { width: 8px; }
.card.bm-mode::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.item {
  display: flex; align-items: center; gap: 8px;
  min-height: 34px; padding: 0 10px;
  border-radius: 7px; font-size: 12px; cursor: pointer;
  white-space: nowrap;
}
.bm-mode .item { min-height: 30px; padding: 0 8px; }
.item:hover:not(.disabled) { background: var(--hover); }
.item.disabled { opacity: .38; cursor: default; }
.item .k {
  margin-left: auto; padding-left: 22px;
  color: var(--text-dim); font-size: 11px;
}
/* 书签菜单标题行（不可点） */
.bm-mode .bm-head {
  padding: 5px 8px 7px; font-size: 11px; color: var(--text-dim);
  border-bottom: 1px solid var(--divider); margin-bottom: 4px; cursor: default;
}
/* 书签 item 里的首字母色块（favicon 位） */
.bm-mode .bm-ico {
  width: 16px; height: 16px; min-width: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #fff; background: #4285f4;
}
.bm-mode .bm-ico.bm-folder-ico { background: transparent; font-size: 13px; }
.bm-mode .bm-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
/* 子文件夹 chevron */
.bm-mode .bm-chev { color: var(--text-dim); font-size: 14px; margin-left: auto; }
.sep { height: 1px; background: var(--divider); margin: 5px 8px; }
/* 键盘焦点可见 */
:focus-visible { outline: 2px solid var(--accent, #10b981); outline-offset: -1px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);
let items = [];

function tryTheme() {
  invoke('get_settings').then((s) => {
    document.documentElement.dataset.theme = s.theme || 'light';
    document.documentElement.dataset.accent = (s && s.accent) || 'green';
  }).catch(() => {});
}

function fit() {
  // 书签下拉模式：高度由后端按项数设定（最多 520px），此处不覆盖，内部滚动即可
  if (items.some((it) => it.header || it.kind)) return;
  const h = Math.ceil($('#card').getBoundingClientRect().height) + 12;
  invoke('resize_overlay', { height: h }).catch(() => {});
}

function render() {
  const card = $('#card');
  card.innerHTML = '';
  const bmMode = items.some((it) => it.header || it.kind);
  card.classList.toggle('bm-mode', bmMode);
  for (const it of items) {
    if (it.sep) {
      const s = document.createElement('div');
      s.className = 'sep';
      card.appendChild(s);
      continue;
    }
    // 书签菜单标题行
    if (it.header) {
      const h = document.createElement('div');
      h.className = 'bm-head';
      h.textContent = it.label;
      card.appendChild(h);
      continue;
    }
    const el = document.createElement('div');
    el.className = 'item' + (it.disabled ? ' disabled' : '');
    el.setAttribute('role', 'menuitem');
    el.tabIndex = it.disabled ? -1 : 0;
    // 书签菜单：首字母色块（子文件夹用无底色文件夹图标占位，保持对齐）
    if (bmMode && (it.icon || it.kind === 'folder')) {
      const ico = document.createElement('span');
      if (it.kind === 'folder') {
        ico.className = 'bm-ico bm-folder-ico';
        ico.textContent = '📁';
      } else {
        ico.className = 'bm-ico';
        ico.textContent = it.icon;
        // 用 label 派生的稳定色，避免所有项同色
        let hash = 0; for (const ch of it.label) hash = (hash * 31 + ch.charCodeAt(0)) | 0;
        ico.style.background = `hsl(${Math.abs(hash) % 360} 55% 52%)`;
      }
      el.appendChild(ico);
    }
    const label = document.createElement('span');
    label.className = bmMode ? 'bm-label' : '';
    label.textContent = it.label;
    el.appendChild(label);
    if (bmMode && it.kind === 'folder') {
      const chev = document.createElement('span');
      chev.className = 'bm-chev';
      chev.textContent = '›';
      el.appendChild(chev);
    } else if (it.key) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = it.key;
      el.appendChild(k);
    }
    if (!it.disabled) {
      el.onclick = () => pick(it.action);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          const all = [...card.querySelectorAll('.item:not(.disabled)')];
          const i = all.indexOf(el);
          const next = all[(i + (e.key === 'ArrowDown' ? 1 : -1) + all.length) % all.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });
    }
    card.appendChild(el);
  }
  requestAnimationFrame(() => requestAnimationFrame(fit));
}

async function pick(action) {
  try { await invoke('ctxmenu_pick', { action }); } catch (_) {}
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') invoke('close_overlay').catch(() => {}); });

(async () => {
  tryTheme();
  try { items = await invoke('get_ctxmenu'); } catch (_) {}
  render();
})();
</script>
</body>
</html>
