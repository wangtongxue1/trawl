name: CI

# 每次 push / PR 都在三平台做 cargo check 快速编译检查（不打包，速度快）
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        id: check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        if: success()
        working-directory: src-tauri
        run: cargo test --release

      # 失败时把编译错误写到 Job Summary，方便远程排查
      - name: Collect check errors
        if: failure()
        working-directory: src-tauri
        run: |
          echo "## ${{ matrix.os }} cargo check 错误" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo check --all-targets 2>&1 | grep -E "^error|error\[E|^  -->|cannot find|unresolved" | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
