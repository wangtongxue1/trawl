name: CI

# 每次 push / PR 都在三平台做 cargo check 快速编译检查（不打包，速度快）
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        id: check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        if: success()
        working-directory: src-tauri
        run: cargo test --release

      # 失败时把编译错误以注解形式输出（显示在 run 页面，便于远程排查）
      - name: Collect check errors
        if: failure()
        working-directory: src-tauri
        shell: bash
        run: |
          cargo check --all-targets 2>&1 | grep -E '^error(\[E[0-9]+\])?:|^  -->' | head -30 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | tr '\r' ' ' | cut -c1-380)
            echo "::error::$safe"
          done
          cargo check --all-targets 2>&1 | tail -5 || true
