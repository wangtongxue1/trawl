[package]
name = "trawl"
version = "0.7.13"
edition = "2021"
description = "Trawl 元搜浏览器 — 把浏览器做薄，把搜索做快。Less browser. More search."

# 移动端（Android/iOS）要求有 lib 目标；桌面 bin 复用同一套逻辑
[lib]
name = "trawl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_UI_Shell",
  "Win32_Storage_Xps",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Security_Cryptography",
  "Security_Credentials_UI",
] }
winreg = "0.56"
tauri-plugin-single-instance = "2"

[profile.release]
lto = false
codegen-units = 16
strip = true
