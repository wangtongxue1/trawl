<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标签列表</title>
<style>
:root {
  --accent: #10b981; --accent-deep: #0b8f66;
  --panel: #ffffff; --bg: #f6f7f9; --hover: rgba(17,24,39,.06);
  --border: rgba(17,24,39,.10); --divider: rgba(17,24,39,.07);
  --text: #1f2329; --text-dim: #7b8794;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  /* 关键：给圆角和阴影留够透明留白。留白小于阴影扩散半径时，
     webview 的矩形边界会把阴影裁出一条硬边，看起来像「阴影和弹窗不匹配」 */
  height: 100%;
  padding: 22px;
}
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
  user-select: none;
  overflow: hidden;
}
.panel {
  display: flex; flex-direction: column;
  height: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(16,24,40,.16), 0 2px 6px rgba(16,24,40,.06);
}
.head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
}
.head .title { font-size: 14px; font-weight: 600; }
.head .count { font-size: 11.5px; color: var(--text-dim); }
.search {
  flex: 1;
  max-width: 260px;
  margin-left: auto;
  height: 30px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--bg);
  padding: 0 12px;
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  font-family: inherit;
}
.search:focus { background: #fff; border-color: var(--accent); }
.btn {
  border: none; background: var(--bg); color: var(--text-dim);
  height: 30px; padding: 0 12px; border-radius: 8px;
  font-size: 12px; cursor: pointer; font-family: inherit; flex-shrink: 0;
}
.btn:hover { background: var(--hover); color: var(--text); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-deep); color: #fff; }

.grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
  align-content: start;
}
.grid::-webkit-scrollbar { width: 8px; }
.grid::-webkit-scrollbar-thumb { background: rgba(17,24,39,.16); border-radius: 4px; }

.card {
  position: relative;
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px;
  min-height: 148px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  transition: border-color .12s ease, box-shadow .12s ease, transform .12s ease;
}
.card:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(16,24,40,.10); }
.card.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, #fff); }
.card .top { display: flex; align-items: center; gap: 8px; }
.card .fav {
  width: 22px; height: 22px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  font-size: 11px; font-weight: 700; color: var(--accent-deep);
  overflow: hidden; flex-shrink: 0;
}
.card .fav img { width: 16px; height: 16px; object-fit: contain; }
.card .name {
  font-size: 12.5px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card .host { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .x {
  position: absolute; top: 6px; right: 6px;
  width: 20px; height: 20px; line-height: 18px; text-align: center;
  border: none; border-radius: 6px;
  background: transparent; color: var(--text-dim);
  font-size: 13px; cursor: pointer; opacity: 0;
}
.card:hover .x { opacity: 1; }
.card .x:hover { background: var(--hover); color: var(--text); }
.card.plus {
  align-items: center; justify-content: center;
  border-style: dashed; color: var(--text-dim); font-size: 12.5px;
}
.empty { color: var(--text-dim); font-size: 12.5px; padding: 24px; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <span class="title">标签列表</span>
    <span class="count" id="count"></span>
    <input class="search" id="q" type="text" placeholder="搜索标签…" autocomplete="off">
    <button class="btn" id="close-all">全部关闭</button>
    <button class="btn primary" id="new-tab">＋ 新建</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);
const close = () => invoke('close_overlay').catch(() => {});

let st = { tabs: [], activeTab: '', activeWorkspace: '' };
let filter = '';

function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
}
function isInternal(t) {
  return t.url.startsWith('trawl://') || t.url.includes('/newtab.html') || t.url.includes('/settings.html');
}
function titleOf(t) {
  if (isInternal(t)) return t.url.includes('settings') ? '设置' : '新标签页';
  return t.title || hostOf(t.url);
}

function render() {
  const list = st.tabs.filter(t => t.workspaceId === st.activeWorkspace);
  const kw = filter.trim().toLowerCase();
  const shown = kw
    ? list.filter(t => titleOf(t).toLowerCase().includes(kw) || t.url.toLowerCase().includes(kw))
    : list;
  $('#count').textContent = kw ? `${shown.length} / ${list.length}` : `${list.length} 个`;

  const grid = $('#grid');
  grid.innerHTML = '';
  for (const t of shown) {
    const card = document.createElement('div');
    card.className = 'card' + (t.id === st.activeTab ? ' active' : '');

    const top = document.createElement('div');
    top.className = 'top';
    const fav = document.createElement('div');
    fav.className = 'fav';
    const host = hostOf(t.url);
    fav.textContent = isInternal(t) ? 'T' : (host ? host.charAt(0).toUpperCase() : '·');
    // 内置页用带背景的 T，真实站点优先用本地图标，避免远程请求拖慢
    if (isInternal(t)) {
      fav.style.background = 'linear-gradient(135deg,#10b981,#0b8f66)';
      fav.style.color = '#fff';
    } else {
      const LOCAL = {
        'so.qq.com': 'icons/yuanbao.png', 'baidu.com': 'icons/baidu.png', 'bing.com': 'icons/bing.png',
      };
      const part = Object.keys(LOCAL).find(k => host === k || host.endsWith('.' + k));
      const localIcon = part ? LOCAL[part] : '';
      if (localIcon) {
        const img = document.createElement('img');
        img.src = localIcon;
        img.onload = () => { if (img.naturalWidth > 1) { fav.textContent = ''; fav.appendChild(img); } };
        img.onerror = () => {};
      } else if (host) {
        const img = document.createElement('img');
        img.src = `https://${host}/favicon.ico`;
        img.onload = () => { if (img.naturalWidth > 1) { fav.textContent = ''; fav.appendChild(img); } };
        img.onerror = () => {};
      }
    }
    top.appendChild(fav);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = titleOf(t);
    card.appendChild(top);
    card.appendChild(name);

    const h = document.createElement('div');
    h.className = 'host';
    h.textContent = isInternal(t) ? '内置页面' : host;
    card.appendChild(h);

    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = '关闭';
    x.onclick = async (e) => {
      e.stopPropagation();
      await invoke('close_tab_cmd', { id: t.id }).catch(() => {});
      await reload();
    };
    card.appendChild(x);

    card.onclick = async () => {
      await invoke('activate_tab', { id: t.id }).catch(() => {});
      close();
    };
    grid.appendChild(card);
  }

  const plus = document.createElement('div');
  plus.className = 'card plus';
  plus.textContent = '＋ 新建标签页';
  plus.onclick = async () => { await invoke('new_tab').catch(() => {}); close(); };
  grid.appendChild(plus);

  if (!list.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '这个工作区还没有标签页';
    grid.prepend(e);
  }
}

async function reload() {
  try { st = await invoke('initial_state'); } catch {}
  render();
}

$('#q').oninput = () => { filter = $('#q').value; render(); };
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') close();
  if (e.key === 'Enter') {
    const first = $('#grid .card:not(.plus)');
    if (first) first.click();
  }
});
$('#close-all').onclick = async () => {
  // 一次性关闭当前工作区全部标签并只开一个内置新标签页。
  // 不能先 close_tabs 再 open_internal：close_tabs 每关一个活动标签都会补一个元宝搜索页，
  // 面板再开一个新标签页，结果就是两个标签（用户截图反馈的问题）。
  await invoke('close_all_tabs_and_newtab').catch(() => {});
  await reload();
  close();
};
$('#new-tab').onclick = async () => { await invoke('new_tab').catch(() => {}); close(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

reload().then(() => $('#q').focus());
</script>
</body>
</html>
