<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>菜单</title>
<style>
:root {
  --accent: #10b981; --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --panel: #ffffff; --hover: rgba(17,24,39,.055); --divider: rgba(17,24,39,.08);
  --text: #1f2329; --text-dim: #7b8794;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent; overflow: hidden; height: 100%;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text); user-select: none; font-size: 12.5px;
}
svg { display: none; }
.ic {
  width: 16px; height: 16px; display: block; flex-shrink: 0;
  stroke: currentColor; fill: none; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.card {
  background: var(--panel);
  border: 1px solid rgba(17,24,39,.10);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 14px 38px rgba(16,24,40,.20);
  max-height: calc(100vh - 12px);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.card::-webkit-scrollbar { width: 8px; }
.card::-webkit-scrollbar-thumb { background: rgba(17,24,39,.16); border-radius: 4px; }
.group-title {
  font-size: 10.5px; color: var(--text-dim);
  letter-spacing: .5px; padding: 7px 10px 2px;
}
.item {
  display: flex; align-items: center; gap: 10px;
  height: 28px; padding: 0 10px;
  border-radius: 8px; cursor: pointer; white-space: nowrap;
  color: var(--text); transition: background .1s ease;
}
.item:hover { background: var(--hover); }
.item.on { background: var(--accent-soft); color: var(--accent); }
.item.off { opacity: .42; pointer-events: none; }
.item .ic { color: var(--text-dim); }
.item:hover .ic, .item.on .ic { color: var(--accent); }
.item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.item .k {
  color: var(--text-dim); font-size: 10.5px; letter-spacing: .2px;
}
.item.on .k { color: var(--accent); }
.sep { height: 1px; background: var(--divider); margin: 4px 8px; }
.toast {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  background: rgba(20,26,33,.9); color: #fff;
  font-size: 11.5px; padding: 6px 14px; border-radius: 999px;
  opacity: 0; transition: opacity .16s ease; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="12" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></symbol>
  <symbol id="i-incognito" viewBox="0 0 24 24"><path d="M4 13h16"/><circle cx="8" cy="16.5" r="2.2"/><circle cx="16" cy="16.5" r="2.2"/><path d="M8 13c0-3 1.5-5 4-5s4 2 4 5"/></symbol>
  <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.2"/><path d="M4 16V5.6A1.6 1.6 0 0 1 5.6 4H16"/></symbol>
  <symbol id="i-closeothers" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.2"/><path d="M9.4 9.4l5.2 5.2M14.6 9.4l-5.2 5.2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6"/><path d="M10 4v6l-2.4 3.2h8.8L14 10V4"/><path d="M12 13.4V20"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M3.6 12a8.4 8.4 0 1 0 2.6-6.1"/><path d="M3.3 4.7v4.2H7.5"/><path d="M12 7.6V12l3.2 1.9"/></symbol>

  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.6 5.3 8.7 4.7 6.6 4.7c-1 0-2 .1-2.6.4v13.2c.6-.3 1.6-.4 2.6-.4 2.1 0 4 .6 5.4 1.8 1.4-1.2 3.3-1.8 5.4-1.8 1 0 2 .1 2.6.4V5.1c-.6-.3-1.6-.4-2.6-.4-2.1 0-4 .6-5.4 1.8z"/><path d="M12 6.5v13.2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-find" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
  <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></symbol>
  <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></symbol>
  <symbol id="i-zoom-reset" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.6 13.4a3.6 3.6 0 0 0 5.1 0l2.4-2.4a3.6 3.6 0 0 0-5.1-5.1L11.7 7.2"/><path d="M13.4 10.6a3.6 3.6 0 0 0-5.1 0L5.9 13a3.6 3.6 0 0 0 5.1 5.1l1.3-1.3"/></symbol>
  <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M12 4v16"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.4l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
  <symbol id="i-command" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9.2 9.8l2 2.2-2 2.2M13.2 14.4h3"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-3v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2.1-2.1.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4v-3h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L7.5 5l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3h3v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.6 6l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1H21v3h-.2a1.7 1.7 0 0 0-1.4 1z"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M10 3.5h4v2.1a1.8 1.8 0 1 0 3.6 0V3.5H21v4.9h-2.1a1.8 1.8 0 1 0 0 3.6H21v7.5h-5.2v-2.1a1.8 1.8 0 1 0-3.6 0v2.1H3V12h2.1a1.8 1.8 0 1 0 0-3.6H3V3.5h7z"/></symbol>
  <symbol id="i-translate" viewBox="0 0 24 24"><path d="M3 5.5h8.5M7.2 3.5v2c0 3.6-1.7 6.4-4.2 8.2"/><path d="M4.6 9.3c1.5 2.6 3.6 4 6.4 4.9"/><path d="M12.6 20.5l4-10.5 4 10.5"/><path d="M14.2 16.7h4.9"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3.2L9.4 5.4h5.2L16.8 8H20v11H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V4h10v4"/><rect x="4" y="8" width="16" height="8" rx="1.8"/><path d="M7 13.5h10V20H7z"/></symbol>
  <symbol id="i-feedback" viewBox="0 0 24 24"><path d="M4 5.5h16v11H9.6L4 20.5z"/><path d="M8 9.5h8M8 12.5h5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4"/><path d="M12 7.6v.2"/></symbol>
  <symbol id="i-exit" viewBox="0 0 24 24"><path d="M13 4H5v16h8"/><path d="M9.5 12h11M17 8.5l3.5 3.5-3.5 3.5"/></symbol>
</svg>

<div class="card" id="card"></div>
<div class="toast" id="toast">已复制</div>
<script>
const { invoke } = window.__TAURI__.core;
const close = () => invoke('close_overlay').catch(() => {});
// 先执行动作再关浮层：先 close 会让紧随其后的 IPC 丢失。
const runOverlay = (cmd, args) => { invoke(cmd, args || {}).catch(() => {}); };
const runLocal = async (cmd, args) => { try { await invoke(cmd, args || {}); } catch {} close(); };

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 900);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    } catch { return false; }
  }
}

function isInternal(t) {
  return !t || t.url.startsWith('trawl://') || t.url.includes('/newtab.html') || t.url.includes('/settings.html') || t.url.includes('/extensions.html');
}

/** 内置插件状态：读 extensions.json 里的开关与配置（读不到按「开启」处理） */
async function extState(id) {
  try {
    const list = await invoke('get_extensions');
    const it = (list || []).find(x => x.id === id);
    if (!it) return { enabled: true, cfg: {} };
    return { enabled: !!it.enabled, cfg: it.cfg || {} };
  } catch { return { enabled: true, cfg: {} }; }
}

/** 链接净化：去掉 utm/spm 等跟踪参数（keepRef 时保留 from / ref / source） */
function sanitizeUrl(url, keepRef) {
  try {
    const u = new URL(url);
    const kill = [];
    u.searchParams.forEach((_, k) => {
      const lk = k.toLowerCase();
      if (/^utm_/.test(lk) || /^spm/.test(lk) || /^vd_/.test(lk) || /^tt_/.test(lk) || /^share_/.test(lk)
        || ['ns','si','poc_token','track_id','ct'].includes(lk)) kill.push(k);
      else if (!keepRef && ['from','ref','ref_source','refer','source','fr'].includes(lk)) kill.push(k);
    });
    kill.forEach(k => u.searchParams.delete(k));
    return u.toString();
  } catch { return url; }
}

/** 翻译：页内沉浸式翻译由 Rust 侧 toggle_translate 注入脚本完成，不再跳百度 */

async function build() {
  let st = { tabs: [], split: null, settings: {} };
  try { st = await invoke('initial_state'); } catch {}
  const active = (st.tabs || []).find(t => t.id === st.activeTab);
  const tabs = (st.tabs || []).filter(t => t.workspaceId === st.activeWorkspace);
  const nextTab = active ? tabs[(tabs.findIndex(t => t.id === active.id) + 1) % Math.max(tabs.length, 1)] : null;
  const vertical = !!st.settings?.verticalTabs;
  const noActive = !active;

  const items = [
    { group: '标签页' },
    { label: '新建标签页', key: 'Ctrl+T', icon: 'i-plus', fn: () => runLocal('new_tab') },
    { label: '新建窗口', key: '', icon: 'i-window', fn: () => runLocal('open_standalone_window', { incognito: false }) },
    { label: '新建无痕窗口', key: '', icon: 'i-incognito', fn: () => runLocal('open_standalone_window', { incognito: true }) },
    { label: '复制标签页', key: '', icon: 'i-dup', off: noActive, fn: () => active && runLocal('duplicate_tab', { id: active.id }) },
    { label: '关闭其他标签页', key: '', icon: 'i-closeothers', off: noActive || tabs.length < 2, fn: () => active && runLocal('close_other_tabs', { id: active.id }) },
    { label: active && active.pinned ? '取消固定标签页' : '固定标签页', key: '', icon: 'i-pin', off: noActive, fn: () => active && runLocal('toggle_pin', { id: active.id }) },
    { sep: true },
    { label: '历史记录', key: 'Ctrl+H', icon: 'i-clock', fn: () => runOverlay('ui_action', { what: 'history' }) },
    { label: '书签', key: 'Ctrl+Shift+B', icon: 'i-bookmark', fn: () => runOverlay('ui_action', { what: 'bookmarks' }) },
    { label: '下载', key: 'Ctrl+J', icon: 'i-download', fn: () => runOverlay('ui_action', { what: 'downloads' }) },
    { sep: true },
    { group: '当前页面' },
    { label: '重新加载', key: 'Ctrl+R', icon: 'i-reload', off: isInternal(active), fn: () => runLocal('nav_reload') },
    { label: '页内查找', key: 'Ctrl+F', icon: 'i-find', off: isInternal(active), fn: () => runOverlay('ui_action', { what: 'find' }) },
    { label: '放大页面', key: 'Ctrl+=', icon: 'i-zoom-in', off: noActive, fn: () => runLocal('zoom_page', { delta: 0.1 }) },
    { label: '缩小页面', key: 'Ctrl+-', icon: 'i-zoom-out', off: noActive, fn: () => runLocal('zoom_page', { delta: -0.1 }) },
    { label: '实际大小', key: 'Ctrl+0', icon: 'i-zoom-reset', off: noActive, fn: () => runLocal('zoom_page', { delta: 0 }) },
    { label: '复制当前网址', key: '', icon: 'i-link', off: noActive || isInternal(active),
      fn: async () => {
        if (!active) return;
        // 「链接净化」插件开启时自动去掉 utm/spm 等跟踪参数
        const ext = await extState('trawl-shortlink');
        const url = ext.enabled ? sanitizeUrl(active.url, ext.cfg.keepRef === true) : active.url;
        const ok = await copyText(url);
        toast(ok ? (ext.enabled && url !== active.url ? '已复制净化后的网址' : '已复制网址') : '复制失败');
        if (ok) setTimeout(close, 520);
      } },
    { label: '翻译此页', key: '', icon: 'i-translate', off: noActive || isInternal(active),
      fn: async () => {
        if (!active) return;
        const ext = await extState('trawl-translate');
        if (!ext.enabled) { toast('网页翻译插件未开启'); return; }
        runLocal('toggle_translate', { id: active.id, to: ext.cfg.target ? String(ext.cfg.target) : null });
      } },
    { label: '阅读模式', key: '', icon: 'i-book', off: noActive || isInternal(active),
      fn: () => active && runLocal('toggle_reader', { id: active.id }) },
    { label: '屏幕截图', key: '', icon: 'i-cam',
      fn: async () => {
        close();
        setTimeout(async () => {
          try { await invoke('capture_screen'); toast('截图已保存到图片\\Trawl截图'); } catch { toast('截图失败'); }
        }, 240);
      } },
    { label: '打印…', key: 'Ctrl+P', icon: 'i-print', off: noActive, fn: () => runLocal('print_page') },
    { sep: true },
    { group: '工具与设置' },
    { label: vertical ? '切换为水平标签栏' : '切换为垂直标签栏', key: '', icon: 'i-side', fn: () => runLocal('toggle_vertical_tabs') },
    { label: '命令面板', key: 'Ctrl+K', icon: 'i-command', fn: () => runOverlay('ui_action', { what: 'palette' }) },
    { label: '扩展程序', key: 'Ctrl+Shift+E', icon: 'i-ext', fn: () => runLocal('open_internal', { page: 'extensions' }) },
    { label: '设置', key: '', icon: 'i-settings', fn: () => runLocal('open_internal', { page: 'settings' }) },
    { sep: true },
    { group: '更多' },
    { label: '反馈', key: '', icon: 'i-feedback', fn: () => runLocal('open_feedback') },
    { label: '关于 Trawl 浏览器', key: '', icon: 'i-info',
      fn: async () => {
        let v = '';
        try { v = await invoke('get_version'); } catch {}
        toast('Trawl 元搜浏览器 v' + (v || '0.7.13') + ' · 把浏览器做薄，把搜索做快');
      } },
    { label: '退出', key: 'Alt+F4', icon: 'i-exit', fn: () => runLocal('exit_app') },
  ];

  if (active && nextTab && nextTab.id !== active.id) {
    const on = st.split && st.split.length === 2;
    items.splice(items.findIndex(i => i.group === '工具与设置'), 0,
      {
        label: on ? '退出分屏' : '与下一个标签分屏', key: 'Esc',
        icon: 'i-split', on: !!on,
        fn: () => (on ? runLocal('exit_split') : runLocal('toggle_split', { id: nextTab.id })),
      },
      { label: '收藏当前页', key: 'Ctrl+D', icon: 'i-star', off: isInternal(active),
        fn: async () => {
          if (!active) return;
          try { await invoke('toggle_bookmark', { url: active.url, title: active.title }); } catch {}
          close();
        } },
      { sep: true }
    );
  } else if (active) {
    items.splice(items.findIndex(i => i.group === '工具与设置'), 0,
      { label: '收藏当前页', key: 'Ctrl+D', icon: 'i-star', off: isInternal(active),
        fn: async () => {
          try { await invoke('toggle_bookmark', { url: active.url, title: active.title }); } catch {}
          close();
        } },
      { sep: true }
    );
  }

  const card = document.getElementById('card');
  card.innerHTML = '';   // 预热浮层会重复 build，先清空，避免菜单项叠加
  for (const it of items) {
    if (it.sep) {
      const s = document.createElement('div');
      s.className = 'sep'; card.appendChild(s); continue;
    }
    if (it.group) {
      const g = document.createElement('div');
      g.className = 'group-title'; g.textContent = it.group;
      card.appendChild(g); continue;
    }
    const el = document.createElement('div');
    el.className = 'item' + (it.on ? ' on' : '') + (it.off ? ' off' : '');
    el.innerHTML = '<svg class="ic"><use href="#' + it.icon + '"/></svg><span class="t"></span><span class="k"></span>';
    el.querySelector('.t').textContent = it.label;
    el.querySelector('.k').textContent = it.key || '';
    el.onclick = it.fn;
    card.appendChild(el);
  }

  requestAnimationFrame(() => {
    // 用 scrollHeight 而不是 getBoundingClientRect：card 有 max-height 限制，
    // 视口矮的时候 rect.height 永远等于「当前视口高度-12」，算出来跟原高度一样，
    // 于是窗口永远长不高、菜单被截断（bug 就是这么来的）。
    const el = document.getElementById('card');
    const need = Math.ceil(Math.max(el.scrollHeight, el.getBoundingClientRect().height)) + 14;
    invoke('resize_overlay', { height: need }).catch(() => {});
  });
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
build();
if (window.__TAURI__.event) {
  window.__TAURI__.event.listen('warm-shown', () => setTimeout(build, 90));
}
</script>
</body>
</html>
