name: Release Trawl

# 触发方式：
#   1. 推送 v* 标签：git tag v0.7.13 && git push origin v0.7.13
#   2. 推送 main 分支即自动构建（本地网络推不了标签时的兜底）
#   3. 手动触发：Actions 页面 → Release Trawl → Run workflow
# 产物：
#   Windows: .msi / .exe(NSIS) 安装包 + 便携版 zip
#   macOS:   Apple Silicon (aarch64.dmg) + Intel (x64.dmg)
#   Android: aarch64 APK（单 webview 移动端架构，v0.7.16 起恢复构建）
#   iOS:     暂停（无签名证书；移动端架构已就绪，配好 secrets 后可开）
# 鸿蒙 OS：Tauri 暂不支持 HarmonyOS，无法云端构建（见 README 说明）
#
# 说明：不用 tauri-action，改为显式 npx tauri build + gh release upload：
#   - 构建失败时把日志尾部输出成 ::error:: 注解（run 页面直接可见）
#   - 上传统一走 gh CLI，避免第三方 action 的权限兼容问题

# 仅标签/手动触发：main 推送由 ci.yml 做检查，避免双跑 Release 并发抢
# 同一个草稿 Release / Maven 限流（曾导致 macOS 上传竞态、Android gradle 429）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_ios:
        description: '是否构建 iOS（需要已配置签名 secrets）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  # ============ 桌面端：Windows + macOS ============
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Windows：MSI + NSIS 安装包（tauri.conf.json bundle.targets = all）
          - platform: 'windows-latest'
            args: ''
          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # macOS Intel
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # 仅当 Secrets 真的配置了证书才注入（空字符串也会让 tauri 误去导入 p12 而失败）
      - name: Prepare signing env (only if configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            {
              echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
              echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
              echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "macOS signing enabled"
          fi
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            {
              echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
              echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}"
              echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
              echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            } >> "$GITHUB_ENV"
            echo "Windows Azure signing enabled"
          fi

      - name: Build Trawl (desktop)
        shell: bash
        run: |
          set -o pipefail
          set +e  # 关闭 GitHub 默认注入的 errexit，否则 npm|tee 一失败就跳出脚本
          npm run tauri build -- ${{ matrix.settings.args }} 2>&1 | tee build.log
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            # 把构建日志上传到仓库 ci-logs 分支（gh API，无需 git 凭据）
            SHA=$(git rev-parse HEAD)
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/ci-logs -f sha=$SHA >/dev/null 2>&1 || true
            B64=$(base64 < build.log | tr -d '\n')
            gh api -X PUT "repos/$GH_REPO/contents/logs/desktop-$RUNNER_OS-$GITHUB_RUN_ID.log" \
              -f message="ci: desktop build log" -f content="$B64" -f branch=ci-logs >/dev/null 2>&1 || true
            echo "Build failed (exit $STATUS)，日志已尝试上传到 ci-logs 分支"
            tail -50 build.log | while IFS= read -r line; do
              line=$(printf '%s' "$line" | cut -c1-300)
              echo "::error::$line"
            done
            exit $STATUS
          fi

      # ===== Windows 便携版 zip：把免安装的 trawl.exe 打包 =====
      - name: Package Windows portable zip
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Compress-Archive -Path src-tauri/target/release/trawl.exe -DestinationPath "Trawl-$version-windows-x64-portable.zip" -Force
          Get-Item "Trawl-$version-windows-x64-portable.zip" | Select-Object Name, Length

      # 解析 bundle 目录（带 --target 时产物在 target/<triple>/ 下）
      - name: Resolve bundle dir
        id: bundle
        shell: bash
        run: |
          TARGET=$(printf '%s' "${{ matrix.settings.args }}" | sed -n 's/--target \([a-zA-Z0-9_-]*\)/\1/p')
          if [ -n "$TARGET" ]; then
            echo "dir=src-tauri/target/$TARGET/release/bundle" >> "$GITHUB_OUTPUT"
          else
            echo "dir=src-tauri/target/release/bundle" >> "$GITHUB_OUTPUT"
          fi

      # 确保草稿 Release 存在（多 job 并发上传共用同一个）
      - name: Ensure draft release
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --draft \
              --title "Trawl 元搜浏览器 v$VERSION" \
              --notes "Trawl 元搜浏览器新版本。Windows 用 .msi/.exe 或便携版 zip；macOS Apple Silicon 用 aarch64.dmg，Intel 用 x64.dmg；Android 用 aarch64 APK。" 2>/dev/null || true
          gh release view "v$VERSION" >/dev/null

      # 上传平台产物（.msi/.exe/.dmg/便携 zip）
      - name: Upload desktop artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          B="${{ steps.bundle.outputs.dir }}"
          if [ "${{ matrix.settings.platform }}" = "windows-latest" ]; then
            FILES=( "$B/msi/"*.msi "$B/nsis/"*.exe Trawl-*-windows-x64-portable.zip )
          else
            FILES=( "$B/dmg/"*.dmg )
          fi
          gh release upload "v$VERSION" "${FILES[@]}" --clobber

  # ============ Android：APK（arm64） ============
  # 单 webview 移动端架构（lib.rs mobile 模块 + dist/mobile.html），v0.7.16 起恢复。
  # 无签名 secrets 时自动用 debug 签名，APK 可直接侧载安装。
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），无需额外安装
      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # gen/android 未提交时自动生成（ubuntu runner 自带 Android SDK/NDK）
      - name: Init Android project (if missing)
        if: ${{ !hashFiles('src-tauri/gen/android/**') }}
        run: npx tauri android init

      # 解码签名密钥（可选）：在仓库 Secrets 里配置
      #   ANDROID_KEYSTORE      = keystore 文件的 base64（base64 -w0 my.keystore）
      #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # 不配置时 APK 用 debug 签名，可直接侧载安装，适合内测分发
      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE != ''
        id: keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          mkdir -p src-tauri/gen/android/keystore
          echo "$ANDROID_KEYSTORE" | base64 -d > src-tauri/gen/android/keystore/trawl.keystore
          echo "keystore_path=src-tauri/gen/android/keystore/trawl.keystore" >> "$GITHUB_OUTPUT"

      - name: Build Android APK (arm64)
        env:
          # tauri 官方签名环境变量（未配置签名时为空，走 debug 签名）
          TAURI_ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          set +e  # 关闭 GitHub 默认注入的 errexit，否则 npm|tee 一失败就跳出脚本
          # 未配置签名 secrets 时，release 变体产出的 APK 是 unsigned（无法安装），
          # 因此退回 --debug：由 Android 自动生成的 debug keystore 签名，可直接侧载。
          if [ -n "$TAURI_ANDROID_KEYSTORE_PATH" ]; then
            MODE=""
          else
            MODE="--debug"
            echo "未配置签名密钥，构建 debug 签名 APK（可侧载内测）"
          fi
          npx tauri android build --apk --target aarch64 $MODE 2>&1 | tee android-build.log
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            SHA=$(git rev-parse HEAD)
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/ci-logs -f sha=$SHA >/dev/null 2>&1 || true
            B64=$(base64 < android-build.log | tr -d '\n')
            gh api -X PUT "repos/$GH_REPO/contents/logs/android-$GITHUB_RUN_ID.log" \
              -f message="ci: android build log" -f content="$B64" -f branch=ci-logs >/dev/null 2>&1 || true
            echo "Android build failed (exit $STATUS)，日志已尝试上传到 ci-logs 分支"
            grep -nE 'error|Error|FAILURE|Exception' android-build.log | tail -30 | while IFS= read -r line; do
              line=$(printf '%s' "$line" | cut -c1-300)
              echo "::error::$line"
            done
            exit $STATUS
          fi
          find src-tauri/gen/android -name '*.apk' -exec ls -lh {} \;

      - name: Collect APK
        run: |
          mkdir -p apks
          find src-tauri/gen/android -name '*.apk' -exec cp {} apks/ \;
          ls -lh apks/

      - name: Ensure draft release
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --draft \
              --title "Trawl 元搜浏览器 v$VERSION" \
              --notes "Trawl 元搜浏览器新版本。Windows 用 .msi/.exe 或便携版 zip；macOS Apple Silicon 用 aarch64.dmg，Intel 用 x64.dmg；Android 用 aarch64 APK。" 2>/dev/null || true
          gh release view "v$VERSION" >/dev/null

      - name: Upload APK to release
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "v$VERSION" apks/*.apk --clobber

  # ============ iOS（可选：仅在手动触发且勾选时运行，需签名 secrets） ============
  # ⚠️ 暂时禁用：与 Android 相同原因，移动端 UI 重构后再启用
  build-ios:
    if: false
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-ios,aarch64-apple-ios-sim'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # gen/apple 未提交时自动生成
      - name: Init iOS project (if missing)
        if: ${{ !hashFiles('src-tauri/gen/apple/**') }}
        run: npx tauri ios init

      # 需要在 Secrets 配置（同 macOS 桌面签名那套）：
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY（iPhone Distribution 证书）
      #   APPLE_TEAM_ID
      - name: Decode iOS certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          echo "$APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH"
          security create-keychain -p trawl build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k trawl build.keychain

      - name: Build iOS (unsigned dev/sideload)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          set +e  # 关闭 GitHub 默认注入的 errexit，否则 npm|tee 一失败就跳出脚本
          npx tauri ios build --target aarch64-apple-ios --export-method debugging 2>&1 | tee ios-build.log || {
            tail -50 ios-build.log | while IFS= read -r line; do
              line=$(printf '%s' "$line" | cut -c1-300)
              echo "::error::$line"
            done
            exit 1
          }
          find src-tauri/gen/apple -name '*.ipa' -exec cp {} . \;

      - name: Ensure draft release
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --draft \
              --title "Trawl 元搜浏览器 v$VERSION" \
              --notes "Trawl 元搜浏览器新版本。" 2>/dev/null || true
          gh release view "v$VERSION" >/dev/null

      - name: Upload IPA to release
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "v$VERSION" ./*.ipa --clobber
