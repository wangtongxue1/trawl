name: CI

# 每次 push / PR 都在三平台做 cargo check 快速编译检查（不打包，速度快）
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        id: check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        if: success()
        working-directory: src-tauri
        run: cargo test --release

      # 失败时把编译错误日志提交到 ci-logs 分支（便于远程查看）
      - name: Collect check errors and commit log
        if: failure()
        shell: bash
        run: |
          set -e
          OSNAME=$(echo "${{ matrix.os }}" | cut -d- -f1)
          cd src-tauri
          cargo check --all-targets > ../ci-error-"$OSNAME".log 2>&1 || true
          cd ..
          git config user.email "ci-bot@trawl.local"
          git config user.name "ci-bot"
          git add ci-error-"$OSNAME".log
          git commit -m "ci: ${{ matrix.os }} cargo check error log"
          git push origin "HEAD:ci-logs" -f
