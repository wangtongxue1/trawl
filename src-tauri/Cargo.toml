[package]
name = "trawl"
version = "0.7.24"
edition = "2021"
description = "Trawl 元搜浏览器 — 把浏览器做薄，把搜索做快。Less browser. More search."

# 移动端（Android/iOS）要求有 lib 目标；桌面 bin 复用同一套逻辑
[lib]
name = "trawl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows 专属依赖：不门控会被 macOS/Android 也拉去编译（windows-future 在非
# Windows 目标缺 IMarshal/marshaler/submit 符号，直接编译失败）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_UI_Shell",
  "Win32_Storage_Xps",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Security_Cryptography",
  "Security_Credentials_UI",
] }
winreg = "0.56"

# 单实例插件不支持移动端，桌面平台（Win/Mac/Linux）启用
# reqwest 仅桌面用（更新检测）：Android 上 native-tls 走 OpenSSL 需要 NDK 编 C，
# iOS 上亦无必要（应用商店负责更新），移动端直接不编译
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 文件选择器：导入书签/密码/备份时弹系统文件对话框（仅桌面）
tauri-plugin-dialog = "2"
# 更新检测：拉 GitHub Releases 最新版。
# TLS 用系统实现（Windows=schannel / macOS=Security.framework），避免 rustls 的
# ring C 依赖在部分 MSVC 工具链下编译失败。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

# macOS 专属：钥匙串存储密码（security-framework 的 passwords 模块）+
# Touch ID / 登录密码验证（LocalAuthentication，经 objc2 绑定）
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

[profile.release]
lto = false
codegen-units = 16
strip = true
